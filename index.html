<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wage Battle - Secure Scan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode/html5-qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #f8fafc; }
        .battle-card { background: linear-gradient(160deg, #1e293b 0%, #0f172a 100%); }
        /* ကင်မရာ Frame ကို ဝိုင်းဝိုင်းလေးလုပ်ဖို့ */
        #reader { border: none !important; border-radius: 20px; overflow: hidden; }
        #reader video { border-radius: 20px; object-fit: cover; }
    </style>
</head>
<body class="pb-24">

    <div class="bg-white p-4 shadow-sm flex items-center justify-between sticky top-0 z-50">
        <button onclick="window.history.back()" class="w-10 h-10 flex items-center justify-center rounded-full"><i class="fas fa-chevron-left text-gray-600"></i></button>
        <h1 class="text-lg font-bold">Battle Arena ⚔️</h1>
        <button onclick="showLogs()" class="w-10 h-10 text-blue-500"><i class="fas fa-history"></i></button>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-6">

        <div id="view-connect" class="space-y-6">
            <div class="bg-white rounded-[2rem] p-8 shadow-xl text-center border border-slate-100">
                <div class="flex justify-center mb-6">
                    <div id="my-qr" class="p-3 bg-white rounded-2xl shadow-inner border border-slate-50"></div>
                </div>
                <h2 id="my-name" class="text-xl font-bold text-slate-800">---</h2>
                <p class="text-xs font-black text-rose-500 mt-1 uppercase tracking-widest" id="my-code">---</p>

                <div class="mt-8">
                    <button id="scan-btn" onclick="toggleCamera()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-3 active:scale-95 transition-all shadow-lg shadow-blue-200">
                        <i class="fas fa-camera"></i> <span id="btn-text">ကင်မရာဖွင့်မည်</span>
                    </button>
                </div>
            </div>

            <div id="reader-container" class="hidden animate-pulse">
                <div id="reader" class="w-full"></div>
                <p class="text-center text-xs text-slate-400 mt-3 italic">သူငယ်ချင်း၏ QR ကို Frame ထဲတွင် ထားပေးပါ</p>
            </div>
        </div>

        <div id="view-arena" class="hidden space-y-4">
            <div class="battle-card rounded-[2.5rem] p-8 shadow-2xl text-white">
                <div class="flex justify-between items-center mb-10">
                    <div class="text-center w-5/12">
                        <div class="w-16 h-16 bg-white/10 rounded-2xl mx-auto mb-2 flex items-center justify-center text-3xl border border-white/20">👷</div>
                        <p id="p1-bal" class="text-xl font-black">0฿</p>
                        <p class="text-[10px] opacity-50 uppercase font-bold">You</p>
                    </div>
                    <div class="text-2xl font-black italic text-rose-500">VS</div>
                    <div class="text-center w-5/12">
                        <div class="w-16 h-16 bg-white/10 rounded-2xl mx-auto mb-2 flex items-center justify-center text-3xl border border-white/20">👤</div>
                        <p id="p2-bal" class="text-xl font-black">0฿</p>
                        <p id="p2-name" class="text-[10px] opacity-50 uppercase font-bold">Opponent</p>
                    </div>
                </div>
                <div class="h-3 bg-white/10 rounded-full flex overflow-hidden">
                    <div id="p1-bar" class="bg-blue-500 transition-all duration-1000"></div>
                    <div id="p2-bar" class="bg-rose-500 transition-all duration-1000"></div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="location.reload()" class="bg-white py-4 rounded-2xl font-bold text-slate-700 border border-slate-200"><i class="fas fa-sync-alt mr-2 text-blue-500"></i> Refresh</button>
                <button onclick="endBattle()" class="bg-rose-50 text-rose-600 py-4 rounded-2xl font-bold border border-rose-100"><i class="fas fa-times-circle mr-2"></i> End Battle</button>
            </div>
        </div>

    </div>

    <script>
        let html5QrCode = null;
        const profile = JSON.parse(localStorage.getItem('f_prof')) || { name: 'User', code: 'EMP001' };
        const records = JSON.parse(localStorage.getItem('f_recs')) || [];
        let currentOpponent = localStorage.getItem('f_battle_active');

        window.onload = () => {
            document.getElementById('my-name').innerText = profile.name;
            document.getElementById('my-code').innerText = "DAILYWAGE:" + profile.code;
            
            // QR Code ထဲမှာ App User ဖြစ်ကြောင်း prefix ထည့်ထားမယ်
            new QRCode(document.getElementById("my-qr"), {
                text: "DAILYWAGE:" + profile.code,
                width: 140, height: 140
            });

            if(currentOpponent) showArena();
        };

        function toggleCamera() {
            const container = document.getElementById('reader-container');
            const btnText = document.getElementById('btn-text');

            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                btnText.innerText = "ကင်မရာ ပိတ်မည်";
                startScanner();
            } else {
                stopScanner();
                container.classList.add('hidden');
                btnText.innerText = "ကင်မရာဖွင့်မည်";
            }
        }

        function startScanner() {
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 15, qrbox: { width: 250, height: 250 } };

            html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
                // အရေးကြီးဆုံးအပိုင်း - App User ဟုတ်မဟုတ် စစ်ဆေးခြင်း
                if (decodedText.startsWith("DAILYWAGE:")) {
                    const friendCode = decodedText.split(":")[1];
                    confirmConnection(friendCode);
                } else {
                    alert("❌ မှားယွင်းနေပါသည်။ Daily Wage App အသုံးပြုသူ၏ QR ဖြစ်ရပါမည်။");
                    stopScanner();
                    toggleCamera();
                }
            });
        }

        function stopScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode = null;
                }).catch(err => console.log(err));
            }
        }

        function confirmConnection(code) {
            stopScanner();
            if(confirm(`${code} နှင့် ပြိုင်ပွဲ စတင်မလား?`)) {
                localStorage.setItem('f_battle_active', code);
                currentOpponent = code;
                showArena();
            } else {
                location.reload();
            }
        }

        function showArena() {
            document.getElementById('view-connect').classList.add('hidden');
            document.getElementById('view-arena').classList.remove('hidden');
            
            // Calculate Balances
            const myInc = records.filter(r => r.type === 'income').reduce((a, b) => a + b.amt, 0);
            const myExp = records.filter(r => r.type === 'expense').reduce((a, b) => a + b.amt, 0);
            const myBal = myInc - myExp;
            
            const oppBal = myBal * 0.85; // Simulated

            document.getElementById('p2-name').innerText = currentOpponent;
            document.getElementById('p1-bal').innerText = Math.round(myBal).toLocaleString() + "฿";
            document.getElementById('p2-bal').innerText = Math.round(oppBal).toLocaleString() + "฿";

            const total = Math.abs(myBal) + Math.abs(oppBal);
            const p1Width = (myBal / (total || 1)) * 100;
            document.getElementById('p1-bar').style.width = p1Width + "%";
            document.getElementById('p2-bar').style.width = (100 - p1Width) + "%";
        }

        function endBattle() {
            if(confirm("ပြိုင်ပွဲကို ရပ်နားမှာလား?")) {
                localStorage.removeItem('f_battle_active');
                location.reload();
            }
        }
    </script>
</body>
</html>
