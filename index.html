<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Wage - App</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        :root { --blue: #1a2a6c; --red: #b21f1f; --gold: #ffd700; --dark: #0f1c3f; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, var(--dark), var(--blue)); color: #fff; min-height: 100vh; padding-bottom: 30px; }
        
        .header { background: linear-gradient(135deg, var(--blue), var(--red)); padding: 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .card { background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(10px); border-radius: 15px; padding: 20px; margin: 15px; border: 1px solid rgba(255,255,255,0.1); }
        
        .badge-id { background: #000; color: var(--gold); padding: 10px; border-radius: 8px; font-size: 18px; font-weight: bold; letter-spacing: 2px; display: inline-block; margin-bottom: 15px; border: 1px dashed var(--gold); }
        
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; font-size: 14px; }
        .btn-gold { background: linear-gradient(135deg, var(--gold), #b8860b); color: #000; }
        .btn-blue { background: #2563eb; color: #fff; }
        .btn-red { background: #e11d48; color: #fff; }
        
        input, select { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: #fff; text-align: center; font-size: 16px; }
        input::placeholder { color: rgba(255,255,255,0.5); font-size: 14px; }

        /* Battle UI */
        .hp-container { margin: 20px 0; }
        .hp-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--gold); margin-bottom: 5px; font-weight: bold; }
        .hp-track { height: 20px; background: rgba(0,0,0,0.5); border-radius: 10px; overflow: hidden; border: 1px solid var(--gold); display: flex; }
        .hp-fill { height: 100%; width: 50%; background: linear-gradient(90deg, #4caf50, var(--gold)); transition: 1s ease; }
        .vs-grid { display: grid; grid-template-columns: 1fr 40px 1fr; align-items: center; text-align: center; margin-bottom: 10px; }
        .wage-amt { font-size: 24px; font-weight: 900; color: var(--gold); }

        .chat-box { height: 150px; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 10px; padding: 10px; margin-bottom: 10px; font-size: 13px; }
        .msg { margin-bottom: 6px; padding: 8px 12px; border-radius: 10px; max-width: 85%; }
        .msg.me { background: var(--blue); margin-left: auto; }
        .msg.opp { background: rgba(255,255,255,0.1); }
        .log-list { font-size: 11px; color: #94a3b8; height: 70px; overflow-y: auto; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; }

        /* Noti Popup */
        #notiPop { position: fixed; top: 20px; left: 15px; right: 15px; background: var(--gold); color: #000; padding: 20px; border-radius: 15px; z-index: 1000; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.7); text-align: center; border: 2px solid #fff; }
    </style>
</head>
<body>

    <div id="notiPop">
        <h3 style="margin-bottom: 10px;">🔔 စိန်ခေါ်မှု ရောက်နေပါသည်!</h3>
        <p id="inviterName" style="font-size:14px; margin-bottom:15px;"></p>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-blue" style="margin:0;" onclick="acceptInvite()">လက်ခံမည်</button>
            <button class="btn btn-red" style="margin:0;" onclick="rejectInvite()">ငြင်းမည်</button>
        </div>
    </div>

    <div class="header">
        <h2 id="statusText">⚔️ BATTLE WAGE</h2>
    </div>

    <div id="setupArea">
        <div class="card" style="text-align: center;">
            <p style="font-size: 12px; color: #cbd5e1; margin-bottom: 5px;">သင့်၏ Battle ID</p>
            <div class="badge-id" id="myBattleIdDisp">------</div>
            
            <hr style="border-color: rgba(255,255,255,0.1); margin: 15px 0;">

            <h3 style="margin-bottom: 10px; font-size: 16px;">၁။ App အတွင်း တိုက်ရိုက်စိန်ခေါ်ရန်</h3>
            <input type="text" id="targetIdInput" placeholder="ပြိုင်ဘက်၏ Battle ID ရိုက်ထည့်ပါ">
            <div style="display:flex; gap:10px;">
                <select id="duration" style="flex:1; margin:0;">
                    <option value="15">၁၅ ရက်စာ</option>
                    <option value="30">ရက် ၃၀ စာ</option>
                </select>
                <button class="btn btn-gold" style="flex:1; margin:0;" onclick="sendInAppInvite()">စိန်ခေါ်မည်</button>
            </div>

            <hr style="border-color: rgba(255,255,255,0.1); margin: 20px 0;">

            <h3 style="margin-bottom: 10px; font-size: 16px;">၂။ Room Code ဖြင့် ဝင်ရန်</h3>
            <input type="text" id="roomCodeInput" placeholder="Room Code ဂဏန်း ၆ လုံး ထည့်ပါ">
            <button class="btn btn-blue" onclick="joinByRoomCode()">အခန်းထဲ ဝင်မည်</button>
        </div>
    </div>

    <div id="battleArea" class="card" style="display:none;">
        <div style="text-align:center; margin-bottom:15px;">
            <span style="background:rgba(0,0,0,0.5); padding:5px 10px; border-radius:5px; font-size:12px; color:var(--gold);">
                ROOM CODE: <strong id="currentRoomCodeDisp">------</strong>
            </span>
        </div>

        <div class="vs-grid">
            <div>
                <div id="p1Name" style="font-size:12px; opacity:0.8;">You</div>
                <div class="wage-amt" id="p1Wage">0฿</div>
            </div>
            <div style="font-weight:bold; color:var(--red); font-size:20px;">VS</div>
            <div>
                <div id="p2Name" style="font-size:12px; opacity:0.8;">Opponent</div>
                <div class="wage-amt" id="p2Wage">0฿</div>
            </div>
        </div>

        <div class="hp-container">
            <div class="hp-label"><span id="p1Perc">50%</span><span id="p2Perc">50%</span></div>
            <div class="hp-track"><div id="hpFill" class="hp-fill"></div></div>
        </div>

        <div class="chat-box" id="chatBox"></div>
        <div style="display:flex; gap:8px; margin-bottom:15px;">
            <input type="text" id="chatInput" placeholder="စာတိုပို့ရန်..." style="margin:0; text-align:left;">
            <button class="btn btn-gold" style="width:70px; margin:0;" onclick="sendChat()">ပို့</button>
        </div>

        <div class="log-list" id="logList"></div>
    </div>

    <script>
        // --- 1. Firebase Initialization ---
        const fbConfig = { databaseURL: "https://seafood-oder-default-rtdb.firebaseio.com" };
        firebase.initializeApp(fbConfig);
        const db = firebase.database();

        // --- 2. Generate/Load Permanent Battle ID ---
        const profile = JSON.parse(localStorage.getItem('f_prof')) || { name: "User", code: "000" };
        let myBattleId = localStorage.getItem('my_battle_id');
        
        // ဝန်ထမ်းကုဒ်မသုံးဘဲ Random 6 လုံးကို Permanent ID အဖြစ်ထုတ်သည်
        if (!myBattleId) {
            myBattleId = Math.random().toString(36).substring(2, 8).toUpperCase();
            localStorage.setItem('my_battle_id', myBattleId);
        }
        
        document.getElementById('myBattleIdDisp').innerText = myBattleId;

        let currentRoomCode = null;
        let myRole = null;
        let pendingRoomCode = null;

        // --- 3. Listen for Incoming In-App Invites ---
        db.ref(`invites/${myBattleId}`).on('value', snap => {
            if (snap.exists()) {
                const inviteData = snap.val();
                document.getElementById('inviterName').innerText = `${inviteData.fromName} မှ သင့်အား စိန်ခေါ်နေပါသည်!`;
                pendingRoomCode = inviteData.roomCode;
                document.getElementById('notiPop').style.display = 'block';
                if(navigator.vibrate) navigator.vibrate([200, 100, 200]); // Vibrate
            } else {
                document.getElementById('notiPop').style.display = 'none';
            }
        });

        // --- 4. Logic to Send In-App Invite ---
        async function sendInAppInvite() {
            const targetId = document.getElementById('targetIdInput').value.trim().toUpperCase();
            if (!targetId) return alert("ပြိုင်ဘက်၏ Battle ID ထည့်ပါ");
            if (targetId === myBattleId) return alert("မိမိကိုယ်ကို စိန်ခေါ်၍မရပါ");

            const days = document.getElementById('duration').value;
            const startDate = new Date().toISOString().split('T')[0]; // Today
            
            // Generate a 6-digit Room Code
            const roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
            currentRoomCode = roomCode;
            myRole = 'p1';

            const myWage = calculateWage(startDate, days);

            // Create Room
            await db.ref(`rooms/${roomCode}`).set({
                config: { days, startDate, status: 'waiting' },
                p1: { name: profile.name, wage: myWage },
                logs: [{ msg: `${profile.name} က အခန်းဖန်တီးလိုက်သည်။`, time: Date.now() }]
            });

            // Send Noti to Target
            await db.ref(`invites/${targetId}`).set({
                fromName: profile.name,
                roomCode: roomCode,
                timestamp: Date.now()
            });

            alert(`စိန်ခေါ်မှု ပို့လိုက်ပါပြီ။ ${targetId} မှ လက်ခံရန် စောင့်နေပါ...`);
            startBattleUI();
        }

        // --- 5. Logic to Join via Room Code (Manual Input) ---
        async function joinByRoomCode() {
            const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if (!code) return alert("Room Code ထည့်ပါ");
            joinRoom(code);
        }

        // --- 6. Accept / Reject Invite ---
        function acceptInvite() {
            if (pendingRoomCode) joinRoom(pendingRoomCode);
            db.ref(`invites/${myBattleId}`).remove();
            document.getElementById('notiPop').style.display = 'none';
        }

        function rejectInvite() {
            db.ref(`invites/${myBattleId}`).remove();
            document.getElementById('notiPop').style.display = 'none';
        }

        // --- 7. Core Join Logic ---
        async function joinRoom(roomCode) {
            const snap = await db.ref(`rooms/${roomCode}`).once('value');
            if (!snap.exists()) return alert("အခန်းမရှိပါ သို့မဟုတ် Code မှားယွင်းနေပါသည်။");

            currentRoomCode = roomCode;
            myRole = 'p2';

            const conf = snap.val().config;
            const myWage = calculateWage(conf.startDate, conf.days);

            // Enter as Player 2
            await db.ref(`rooms/${roomCode}/p2`).set({ name: profile.name, wage: myWage });
            await db.ref(`rooms/${roomCode}/config/status`).set('active');
            
            pushLog(`${profile.name} က တိုက်ပွဲထဲသို့ ဝင်ရောက်လာသည်။`);
            startBattleUI();
        }

        // --- 8. Wage Calculation ---
        function calculateWage(startDateStr, days) {
            const records = JSON.parse(localStorage.getItem('f_records')) || [];
            const start = new Date(startDateStr);
            const end = new Date(startDateStr);
            end.setDate(start.getDate() + parseInt(days));

            return records.reduce((total, r) => {
                const d = new Date(r.date);
                if (d >= start && d <= end) {
                    return total + (parseFloat(r.basic_wage || 0) + parseFloat(r.ot_pay || 0) + parseFloat(r.extra || 0));
                }
                return total;
            }, 0);
        }

        // --- 9. Battle UI & Live Sync ---
        function startBattleUI() {
            document.getElementById('setupArea').style.display = 'none';
            document.getElementById('battleArea').style.display = 'block';
            document.getElementById('statusText').innerText = "⚔️ LIVE BATTLE";
            document.getElementById('currentRoomCodeDisp').innerText = currentRoomCode;

            // Watch Room Data
            db.ref(`rooms/${currentRoomCode}`).on('value', snap => {
                const data = snap.val();
                if (!data) return;

                const p1 = data.p1;
                const p2 = data.p2 || { name: "စောင့်ဆိုင်းဆဲ...", wage: 0 };

                document.getElementById('p1Name').innerText = p1.name;
                document.getElementById('p1Wage').innerText = Math.round(p1.wage) + "฿";
                document.getElementById('p2Name').innerText = p2.name;
                document.getElementById('p2Wage').innerText = Math.round(p2.wage) + "฿";

                const total = p1.wage + p2.wage;
                const p1Perc = total > 0 ? (p1.wage / total) * 100 : 50;
                document.getElementById('hpFill').style.width = p1Perc + "%";
                document.getElementById('p1Perc').innerText = Math.round(p1Perc) + "%";
                document.getElementById('p2Perc').innerText = Math.round(100 - p1Perc) + "%";
            });

            // Watch Chats
            db.ref(`rooms/${currentRoomCode}/chats`).on('child_added', s => {
                const c = s.val();
                const div = document.createElement('div');
                div.className = `msg ${c.sender === myBattleId ? 'me' : 'opp'}`;
                div.innerText = c.text;
                document.getElementById('chatBox').appendChild(div);
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
            });

            // Watch Logs
            db.ref(`rooms/${currentRoomCode}/logs`).on('child_added', s => {
                const l = s.val();
                const div = document.createElement('div');
                div.innerText = `> ${l.msg}`;
                document.getElementById('logList').prepend(div);
            });

            // Auto-Sync Every 10 Seconds
            setInterval(syncData, 10000);
        }

        function syncData() {
            db.ref(`rooms/${currentRoomCode}/config`).once('value', snap => {
                const conf = snap.val();
                if(!conf) return;
                const currentIncome = calculateWage(conf.startDate, conf.days);
                db.ref(`rooms/${currentRoomCode}/${myRole}/wage`).set(currentIncome);
            });
        }

        // --- 10. Helpers ---
        function sendChat() {
            const text = document.getElementById('chatInput').value;
            if (!text) return;
            db.ref(`rooms/${currentRoomCode}/chats`).push({ sender: myBattleId, text });
            document.getElementById('chatInput').value = "";
        }

        function pushLog(msg) {
            db.ref(`rooms/${currentRoomCode}/logs`).push({ msg, time: Date.now() });
        }
    </script>
</body>
</html>
