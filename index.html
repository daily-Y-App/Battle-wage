<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚔️ Battle Pro Arena</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script> <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        :root { --primary: #0f172a; --secondary: #ef4444; --accent: #22c55e; --bg: #f1f5f9; --card: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--bg); padding-bottom: 90px; }
        .content { padding: 15px; }
        .card { background: var(--card); border-radius: 15px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn:active { transform: scale(0.98); }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        
        /* Scanner UI */
        #scanner-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; }
        #reader { width: 90%; max-width: 400px; border-radius: 15px; overflow: hidden; border: 3px solid white; box-shadow: 0 0 20px rgba(255,255,255,0.2); }

        /* Battle UI */
        .vs-area { font-size: 24px; font-weight: bold; display: flex; justify-content: space-around; align-items: center; margin: 20px 0; }
        .progress-bar { height: 12px; background: #e2e8f0; border-radius: 6px; overflow: hidden; margin-top: 10px; }
        .progress-fill { height: 100%; background: linear-gradient(to right, #2563eb, var(--secondary)); width: 0%; transition: width 0.5s; }

        /* Chat UI */
        .chat-box { height: 200px; overflow-y: auto; border: 1px solid #eee; background: #fafafa; padding: 10px; border-radius: 10px; margin-top: 10px; text-align: left; display: flex; flex-direction: column; gap: 5px; }
        .msg { padding: 8px 12px; border-radius: 8px; font-size: 14px; max-width: 80%; }
        .msg.me { background: #1a2a6c; color: white; align-self: flex-end; }
        .msg.him { background: #fff; border: 1px solid #eee; color: #333; align-self: flex-start; }

        /* Notification */
        #noti { position: fixed; top: 20px; right: 20px; background: var(--accent); color: white; padding: 10px 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); display: none; animation: slideIn 0.3s; z-index: 11000; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        /* Match History */
        .history-item { border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; font-size: 14px; }
        .win { color: var(--accent); font-weight: bold; }
        .lose { color: var(--secondary); font-weight: bold; }
    </style>
</head>
<body>

    <div id="noti">🔔 အသိပေးချက်</div>

    <div class="content">
        <div id="homePage">
            <div class="card">
                <h2>⚔️ Battle Arena</h2>
                <p>သင့် Code: <b id="myCode" style="font-size:20px; color:#1a2a6c;">...</b></p>
                <div id="qrcode" style="display: flex; justify-content: center; margin: 20px 0;"></div>
                <button class="btn" style="background:var(--secondary);" onclick="startScanner()">📷 QR Scan ဖတ်ပြီး စိန်ခေါ်မည်</button>
            </div>

            <div class="card">
                <h3>🔍 Code သို့မဟုတ် Link ဖြင့် ရှာဖွေမည်</h3>
                <div class="input-group">
                    <input type="text" id="oppInput" placeholder="သူငယ်ချင်း၏ Code သို့မဟုတ် Link ကိုရိုက်ပါ">
                </div>
                <button class="btn" style="background:#2563eb;" onclick="startBattleManual()">⚔️ Battle စတင်မည်</button>
                <button class="btn" style="background:#0f172a; margin-top:5px;" onclick="shareMyLink()">🌐 ကိုယ့် Link ကို Share မည်</button>
            </div>

            <div class="card">
                <h3>📜 ပွဲစဉ်မှတ်တမ်း (Match History)</h3>
                <div id="matchHistory">...မှတ်တမ်းမရှိသေးပါ...</div>
            </div>
        </div>

        <div id="battlePage" class="card" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>🛡️ တိုက်ပွဲ</h3>
                <button style="background:none; border:none; color:var(--secondary); font-weight:bold; cursor:pointer;" onclick="endBattle()">ထွက်မည်</button>
            </div>
            
            <div class="vs-area">
                <div id="myName">You</div>
                <div style="color:var(--secondary); font-size:18px;">VS</div>
                <div id="oppName">User</div>
            </div>

            <div style="display:flex; justify-content:space-around; font-weight:bold;">
                <span id="myWage" style="color:#2563eb;">0฿</span>
                <span id="oppWage" style="color:var(--secondary);">0฿</span>
            </div>
            
            <div class="progress-bar">
                <div class="progress-fill" id="vsProgress"></div>
            </div>
            <p id="battleStatus" style="font-size:13px; color:#666; margin-top:5px;">⏳ တိုက်ပွဲစတင်နေပြီ...</p>

            <div class="chat-box" id="chatBox"></div>
            <div style="display:flex; gap:5px; margin-top:10px;">
                <input type="text" id="msgInput" placeholder="စာပို့ရန် (Emoji ပါရစေ)..." style="flex:1; padding:10px; border-radius:8px; border:1px solid #ddd;">
                <button onclick="sendMsg()" style="padding:10px 20px; border-radius:8px; background:#1a2a6c; color:white; border:none;">ပို့</button>
            </div>
        </div>
    </div>

    <div id="scanner-container">
        <div id="reader"></div>
        <button class="btn" style="background:var(--secondary); width:90%; margin-top:15px;" onclick="stopScanner()">❌ Scanner ပိတ်မည်</button>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD7T7WZg0fLGTw6ShqDHjOva-btNF6O1AM",
            authDomain: "seafood-oder.firebaseapp.com",
            databaseURL: "https://seafood-oder-default-rtdb.firebaseio.com",
            projectId: "seafood-oder",
            storageBucket: "seafood-oder.firebasestorage.app",
            messagingSenderId: "428949391732",
            appId: "1:428949391732:web:6aa0a31a4f4ba33765c421"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Local Data
        let myProfile = JSON.parse(localStorage.getItem('f_prof')) || { name: 'You', code: 'EMP' + Date.now().toString().slice(-4), av: '👷', wage: 0 };
        let records = JSON.parse(localStorage.getItem('f_recs')) || [];
        myProfile.wage = records.filter(r => r.type === 'income').reduce((a, b) => a + b.amt, 0) || 0;
        
        let html5QrScanner = null;
        let currentBattleId = null;

        document.getElementById('myCode').innerText = myProfile.code;

        // 1. QR Code ထုတ်ပေးခြင်း
        new QRCode(document.getElementById("qrcode"), { text: myProfile.code, width: 128, height: 128 });

        // 2. QR Scanner (နောက်ကင်မရာ အသေအချာသုံးခြင်း)
        function startScanner() {
            document.getElementById('scanner-container').style.display = 'flex';
            // environment: "back" က နောက်ကင်မရာကို သုံးခိုင်းတာပါ
            html5QrScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250, facingMode: "environment" });
            html5QrScanner.render((decodedText) => {
                stopScanner();
                connectToBattle(decodedText);
            });
        }

        function stopScanner() {
            if (html5QrScanner) html5QrScanner.clear();
            document.getElementById('scanner-container').style.display = 'none';
        }

        // 3. Battle ချိတ်ဆက်ခြင်း
        function startBattleManual() {
            let input = document.getElementById('oppInput').value;
            if(input.includes('?sender=')) input = input.split('?sender=')[1].split('&')[0]; // Extract code from link
            connectToBattle(input);
        }

        function connectToBattle(oppCode) {
            if (!oppCode || oppCode === myProfile.code) return showNoti("❌ Code မှားနေပါသည်");
            
            // Battle Room ID သတ်မှတ်ခြင်း
            currentBattleId = myProfile.code < oppCode ? `${myProfile.code}_${oppCode}` : `${oppCode}_${myProfile.code}`;
            
            // Firebase ဆီ ကိုယ့်ဝင်ငွေ ပို့ထားခြင်း
            db.ref('battles/' + currentBattleId + '/players/' + myProfile.code).set({ name: myProfile.name, wage: myProfile.wage });
            
            // Page ပြောင်းခြင်း
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('battlePage').style.display = 'block';
            
            // Battle Data နားထောင်ခြင်း
            db.ref('battles/' + currentBattleId + '/players').on('value', snap => {
                const players = snap.val();
                if(players && players[oppCode]) {
                    const opp = players[oppCode];
                    const me = players[myProfile.code];
                    
                    document.getElementById('myName').innerText = me.name;
                    document.getElementById('oppName').innerText = opp.name;
                    document.getElementById('myWage').innerText = me.wage.toFixed(0) + '฿';
                    document.getElementById('oppWage').innerText = opp.wage.toFixed(0) + '฿';

                    // Progress Bar
                    const totalWage = me.wage + opp.wage;
                    const fillPercent = totalWage > 0 ? (me.wage / totalWage) * 100 : 50;
                    document.getElementById('vsProgress').style.width = fillPercent + '%';

                    // အသိပေးချက်
                    if(me.wage > opp.wage) document.getElementById('battleStatus').innerHTML = "🔥 မင်းက အသာစီးရနေတယ်!";
                    else if(me.wage < opp.wage) document.getElementById('battleStatus').innerHTML = "😟 တစ်ဖက်လူက သာနေတယ်!";
                    else document.getElementById('battleStatus').innerHTML = "⚖️ သရေဖြစ်နေတယ်!";
                }
            });

            // Chat နားထောင်ခြင်း child_added ကိုသုံးပြီး စာအသစ်တက်လာရင်ပဲ ပြမှာပါ
            db.ref('battles/' + currentBattleId + '/chats').on('child_added', snap => {
                const m = snap.val();
                if(m.time > Date.now() - 5000) showNoti(`💬 ${m.senderName}: ${m.text}`); // New message noti
                
                const div = document.createElement('div');
                div.className = `msg ${m.sender === myProfile.code ? 'me' : 'him'}`;
                div.innerText = m.text;
                document.getElementById('chatBox').appendChild(div);
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
            });
        }

        // 4. စာပို့ခြင်း (Emoji ပါရစေ)
        function sendMsg() {
            const text = document.getElementById('msgInput').value;
            if(!text || !currentBattleId) return;
            db.ref('battles/' + currentBattleId + '/chats').push({
                sender: myProfile.code,
                senderName: myProfile.name,
                text: text,
                time: Date.now()
            });
            document.getElementById('msgInput').value = '';
        }

        // 5. Link ကို Share မည်
        function shareMyLink() {
            const link = `https://daily-y-app.github.io/Battle-wage/?sender=${myProfile.code}`;
            navigator.share({ title: 'Battle Challenge', text: 'ကျွန်တော်နဲ့ DailyWage မှာ ပြိုင်ကြရအောင်!', url: link })
            .catch(() => alert("🔗 Link: " + link));
        }

        // 6. ပွဲစဉ်မှတ်တမ်း (Match History)
        function loadHistory() {
            db.ref('users/' + myProfile.code + '/history').limitToLast(5).once('value', snap => {
                const hist = snap.val();
                const div = document.getElementById('matchHistory'); div.innerHTML = "";
                if(hist) {
                    Object.values(hist).reverse().forEach(h => {
                        const winClass = h.result === 'WIN' ? 'win' : 'lose';
                        div.innerHTML += `<div class="history-item"><span>VS ${h.oppName}</span><span class="${winClass}">${h.result} (${h.myWage.toFixed(0)}฿ vs ${h.oppWage.toFixed(0)}฿)</span></div>`;
                    });
                } else div.innerHTML = "မှတ်တမ်းမရှိသေးပါ";
            });
        }

        // 7. Notification
        function showNoti(txt) {
            const el = document.getElementById('noti'); el.innerText = txt; el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        function endBattle() { location.reload(); } // Simple end for now

        window.onload = () => { loadHistory(); };
    </script>
</body>
</html>
