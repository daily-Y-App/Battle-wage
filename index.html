<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏆 Premium Battle Arena</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root { --gold: #d4af37; --dark: #0f172a; --card: rgba(255, 255, 255, 0.05); --win: #22c55e; --lose: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--dark); color: white; padding: 15px; padding-bottom: 80px; }
        .card { background: var(--card); backdrop-filter: blur(10px); border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 15px; text-align: center; }
        .id-text { font-size: 18px; font-weight: bold; color: var(--gold); letter-spacing: 1px; margin: 10px 0; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 10px; display: inline-block;}
        #qrcode { background: white; padding: 15px; border-radius: 15px; display: inline-block; margin: 10px 0; border: 3px solid var(--gold); }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 15px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-gold { background: linear-gradient(135deg, #d4af37, #b8860b); color: black; }
        .btn-outline { background: transparent; color: var(--gold); border: 2px solid var(--gold); }
        .btn-red { background: var(--lose); color: white; }
        input[type="text"] { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: white; margin-bottom: 15px; text-align: center;}
        .vs-container { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; }
        .wage-text { font-size: 24px; font-weight: 900; color: var(--gold); }
        .hp-track { height: 16px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; border: 1px solid var(--gold); }
        .hp-fill { height: 100%; width: 50%; background: linear-gradient(90deg, #2563eb, var(--gold)); transition: 0.5s ease; }
        .chat-area { height: 180px; overflow-y: auto; background: rgba(0,0,0,0.4); border-radius: 15px; padding: 10px; display: flex; flex-direction: column; gap: 8px; margin: 15px 0; text-align: left; }
        .msg { padding: 8px 14px; border-radius: 12px; font-size: 14px; max-width: 80%; }
        .msg.me { background: var(--gold); color: black; align-self: flex-end; }
        .msg.opp { background: #334155; color: white; align-self: flex-start; }
        #invite-pop { position: fixed; top: 20px; left: 20px; right: 20px; background: var(--gold); color: black; padding: 20px; border-radius: 15px; display: none; z-index: 1000; text-align: center; font-weight: bold;}
        #cam-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:999; display:none; flex-direction:column; align-items:center; justify-content:center; }
        #reader { width: 90%; max-width: 350px; border-radius: 20px; overflow: hidden; border: 3px solid var(--gold); }
    </style>
</head>
<body>

    <div id="invite-pop">
        🔔 <span id="inviterName"></span> မှ တိုက်ပွဲစိန်ခေါ်နေပါသည်!
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn" style="background: black; color: var(--gold); margin:0;" onclick="acceptInvy()">⚔️ လက်ခံမည်</button>
            <button class="btn btn-red" style="margin:0;" onclick="rejectInvy()">❌ ငြင်းမည်</button>
        </div>
    </div>

    <div id="homeUI">
        <div class="card">
            <h3 style="color: var(--gold);">🛡️ My Battle Profile</h3>
            <div id="qrcode"></div><br>
            <div class="id-text" id="myIdDisp">ID: Loading...</div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-gold" onclick="openCam()" style="flex: 1;">📷 QR Scan</button>
                <label class="btn btn-outline" style="flex: 1; cursor: pointer;">🖼️ Gallery <input type="file" accept="image/*" style="display:none;" onchange="scanImg(this)"></label>
            </div>
        </div>
        <div class="card">
            <h4>⚔️ ID ဖြင့်တိုက်ရိုက်စိန်ခေါ်မည်</h4>
            <input type="text" id="targetId" placeholder="စိန်ခေါ်မည့်သူ၏ ID ရိုက်ပါ">
            <button class="btn btn-gold" onclick="manualInvite()">စိန်ခေါ်မည်</button>
        </div>
    </div>

    <div id="battleUI" style="display:none;">
        <div class="card" style="border-color: var(--gold);">
            <div style="display:flex; justify-content:space-between; margin-bottom: 10px;">
                <span style="color:var(--win); font-weight:bold;">● LIVE BATTLE</span>
                <span onclick="location.reload()" style="color:#94a3b8; cursor:pointer;">🏠 ထွက်မည်</span>
            </div>
            <div class="vs-container">
                <div style="flex:1;">
                    <div id="p1Name" style="font-weight:bold;">You</div>
                    <div class="wage-text" id="p1W">0฿</div>
                </div>
                <div style="font-weight:900; color:var(--lose); font-size:20px;">VS</div>
                <div style="flex:1;">
                    <div id="p2Name" style="font-weight:bold;">Opponent</div>
                    <div class="wage-text" id="p2W">0฿</div>
                </div>
            </div>
            <div class="hp-track"><div class="hp-fill" id="hpBar"></div></div>
            <h4 id="resultMsg" style="margin-top:15px;">⚖️ တွက်ချက်နေသည်...</h4>
            <div class="chat-area" id="chatBox"></div>
            <div style="display:flex; gap:10px;">
                <input type="text" id="chatInput" placeholder="စာပို့ရန်..." style="margin:0; flex:1;">
                <button class="btn btn-gold" style="width:70px; margin:0;" onclick="sendChat()">ပို့</button>
            </div>
        </div>
    </div>

    <div id="cam-overlay">
        <div id="reader"></div>
        <button class="btn btn-red" style="width:200px; margin-top:30px;" onclick="closeCam()">❌ ပိတ်မည်</button>
    </div>

    <script>
        const config = { databaseURL: "https://seafood-oder-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) { firebase.initializeApp(config); }
        const db = firebase.database();

        // 🟢 အဓိကပြင်ဆင်ချက်- သင့် App ရဲ့ LocalStorage က Data တွေကို အတိအကျဆွဲယူခြင်း
        let rawProf = JSON.parse(localStorage.getItem('f_prof')) || {};
        let myProf = {
            name: rawProf.name || 'Fighter',
            code: rawProf.code || 'P' + Math.floor(Math.random()*9000),
            wage: parseFloat(rawProf.wage) || 0 // 3014฿ သို့မဟုတ် 750฿ ကို ဆွဲယူမည်
        };

        let currentRoom = null, scanner = null, activeInvy = null;
        document.getElementById('myIdDisp').innerText = "ID: " + myProf.code;
        new QRCode(document.getElementById("qrcode"), { text: myProf.code, width: 150, height: 150 });

        db.ref(`invites/${myProf.code}`).on('value', s => {
            if(s.exists()){
                activeInvy = s.val();
                document.getElementById('inviterName').innerText = activeInvy.fromName;
                document.getElementById('invite-pop').style.display = 'block';
            } else { document.getElementById('invite-pop').style.display = 'none'; }
        });

        function openCam() {
            document.getElementById('cam-overlay').style.display='flex';
            scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (id) => { closeCam(); sendInvite(id); });
        }
        function closeCam() { if(scanner) scanner.stop(); document.getElementById('cam-overlay').style.display='none'; }
        function scanImg(el) { if(el.files[0]) new Html5Qrcode("reader").scanFile(el.files[0], true).then(id => sendInvite(id)); }
        function manualInvite() { sendInvite(document.getElementById('targetId').value.trim()); }

        async function sendInvite(targetId) {
            if(!targetId || targetId === myProf.code) return;
            const roomId = 'RM_' + Date.now();
            await db.ref(`invites/${targetId}`).set({ fromId: myProf.code, fromName: myProf.name, fromWage: myProf.wage, roomId: roomId });
            db.ref(`rooms/${roomId}`).on('value', s => { if(s.exists()) startBattle(roomId); });
        }

        function acceptInvy() {
            const rid = activeInvy.roomId;
            // 🔴 Bug Fix: နှစ်ဖက်စလုံးရဲ့ Data တွေကို 0 မဖြစ်အောင် သေချာထည့်သွင်းခြင်း
            db.ref(`rooms/${rid}/players/${myProf.code}`).set({ n: myProf.name, w: myProf.wage });
            db.ref(`rooms/${rid}/players/${activeInvy.fromId}`).set({ n: activeInvy.fromName, w: activeInvy.fromWage });
            db.ref(`invites/${myProf.code}`).remove();
            startBattle(rid);
        }
        function rejectInvy() { db.ref(`invites/${myProf.code}`).remove(); }

        function startBattle(rid) {
            currentRoom = rid;
            document.getElementById('homeUI').style.display='none';
            document.getElementById('battleUI').style.display='block';

            db.ref(`rooms/${rid}/players`).on('value', s => {
                const ps = s.val(); if(!ps) return;
                let oppKey = Object.keys(ps).find(k => k !== myProf.code);
                let myData = ps[myProf.code], oppData = ps[oppKey] || { n: "စောင့်ဆိုင်းနေသည်...", w: 0 };

                document.getElementById('p1Name').innerText = myData.n;
                document.getElementById('p1W').innerText = Math.round(myData.w) + "฿";
                document.getElementById('p2Name').innerText = oppData.n;
                document.getElementById('p2W').innerText = Math.round(oppData.w) + "฿";

                let total = myData.w + oppData.w;
                let perc = total > 0 ? (myData.w / total) * 100 : 50;
                document.getElementById('hpBar').style.width = perc + "%";
                document.getElementById('resultMsg').innerText = myData.w > oppData.w ? "🔥 သင်က အသာစီးရနေသည်!" : (myData.w < oppData.w ? "⚠️ ပြိုင်ဘက်က အသာစီးရနေသည်!" : "⚖️ သရေကျနေသည်");
            });

            db.ref(`rooms/${rid}/chats`).on('child_added', s => {
                const msg = s.val();
                const div = document.createElement('div');
                div.className = `msg ${msg.sender === myProf.code ? 'me' : 'opp'}`;
                div.innerText = msg.text;
                document.getElementById('chatBox').appendChild(div);
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
            });
        }

        function sendChat() {
            const txt = document.getElementById('chatInput').value;
            if(txt && currentRoom) {
                db.ref(`rooms/${currentRoom}/chats`).push({ sender: myProf.code, text: txt });
                document.getElementById('chatInput').value = '';
            }
        }
    </script>
</body>
</html>
