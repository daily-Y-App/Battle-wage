<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚔️ Pro Battle Arena</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root { --primary: #1a2a6c; --secondary: #b21f1f; --accent: #22c55e; --bg: #f8fafc; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: var(--bg); padding: 15px; color: #334155; }
        .card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; margin-bottom: 15px; border: 1px solid #e2e8f0; }
        h3 { margin-bottom: 15px; color: var(--primary); display: flex; align-items: center; justify-content: center; gap: 8px; }
        
        /* QR Area */
        #qrcode { display: flex; justify-content: center; margin: 20px 0; padding: 15px; background: #fff; border-radius: 15px; border: 1px dashed #cbd5e1; }
        .my-code-badge { background: #f1f5f9; padding: 8px 15px; border-radius: 10px; font-weight: bold; color: var(--primary); font-size: 18px; margin-bottom: 10px; }

        /* Buttons */
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-scan { background: var(--secondary); color: white; }
        .btn-gallery { background: #0f172a; color: white; }
        .btn-battle { background: #2563eb; color: white; }
        .btn:active { transform: scale(0.98); }

        /* Scanner Overlay */
        #scanner-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; display: none; flex-direction: column; justify-content: center; align-items: center; }
        #reader { width: 85%; max-width: 400px; border-radius: 20px; overflow: hidden; border: 4px solid white; }

        /* Battle UI */
        #battlePage { display: none; }
        .vs-card { display: flex; justify-content: space-around; align-items: center; margin: 20px 0; }
        .player-info { flex: 1; }
        .player-wage { font-size: 22px; font-weight: bold; margin-top: 5px; }
        .progress-container { height: 14px; background: #e2e8f0; border-radius: 7px; overflow: hidden; margin: 15px 0; }
        .progress-bar { height: 100%; background: linear-gradient(to right, #2563eb, var(--secondary)); width: 50%; transition: width 0.5s; }

        /* Chat */
        .chat-box { height: 250px; overflow-y: auto; background: #f1f5f9; border-radius: 15px; padding: 15px; display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
        .msg { padding: 10px 14px; border-radius: 12px; font-size: 14px; max-width: 85%; word-wrap: break-word; }
        .msg.me { background: var(--primary); color: white; align-self: flex-end; }
        .msg.him { background: white; color: #334155; align-self: flex-start; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        input[type="text"] { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #cbd5e1; font-size: 16px; outline: none; }
    </style>
</head>
<body>

    <div id="homePage">
        <div class="card">
            <h3>⚔️ Battle Arena</h3>
            <p style="font-size: 13px; color: #64748b;">သင့် Code ကို သူငယ်ချင်းကိုပြပြီး စိန်ခေါ်ခိုင်းပါ</p>
            <div id="qrcode"></div>
            <div class="my-code-badge" id="myCodeDisp">---</div>
            
            <button class="btn btn-scan" onclick="startCamera()">📷 QR Scan ဖတ်မည်</button>
            
            <label class="btn btn-gallery">
                🖼️ Gallery မှ ပုံရွေးမည်
                <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="scanFile(this)">
            </label>
        </div>

        <div class="card">
            <h3>🔍 တိုက်ရိုက်စိန်ခေါ်မည်</h3>
            <input type="text" id="targetInput" placeholder="သူငယ်ချင်း၏ Code ကိုရိုက်ပါ">
            <button class="btn btn-battle" onclick="manualJoin()">⚔️ Battle စတင်မည်</button>
        </div>
    </div>

    <div id="battlePage" class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <b style="color: var(--secondary);">🛡️ တိုက်ပွဲဝင်နေသည်</b>
            <button onclick="location.reload()" style="border:none; background:none; color:#64748b; font-weight:bold;">ထွက်မည်</button>
        </div>

        <div class="vs-card">
            <div class="player-info">
                <div id="myName">You</div>
                <div class="player-wage" id="myWage" style="color: #2563eb;">0฿</div>
            </div>
            <div style="font-weight: bold; color: var(--secondary); font-size: 20px;">VS</div>
            <div class="player-info">
                <div id="oppName">User</div>
                <div class="player-wage" id="oppWage" style="color: var(--secondary);">0฿</div>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="vBar"></div>
        </div>
        <p id="bStatus" style="font-size: 13px; font-weight: bold;">⏳ စောင့်ဆိုင်းနေသည်...</p>

        <div class="chat-box" id="chatBox"></div>
        <div style="display: flex; gap: 8px; margin-top: 15px;">
            <input type="text" id="msgInput" placeholder="စာတို/အီမိုဂျီ ပို့ရန်...">
            <button class="btn btn-battle" style="width: 80px; margin-top: 0;" onclick="sendMsg()">ပို့</button>
        </div>
    </div>

    <div id="scanner-container">
        <div id="reader"></div>
        <button class="btn btn-scan" style="width: 85%; margin-top: 20px;" onclick="stopCamera()">❌ ပိတ်မည်</button>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyD7T7WZg0fLGTw6ShqDHjOva-btNF6O1AM",
            databaseURL: "https://seafood-oder-default-rtdb.firebaseio.com",
            projectId: "seafood-oder",
            appId: "1:428949391732:web:6aa0a31a4f4ba33765c421"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Local Data
        let myProf = JSON.parse(localStorage.getItem('f_prof')) || { name: 'You', code: 'EMP' + Math.floor(1000 + Math.random() * 9000), wage: 0 };
        let scanner = null;
        let bId = null;

        document.getElementById('myCodeDisp').innerText = "CODE: " + myProf.code;

        // 1. QR Code ထုတ်ခြင်း
        new QRCode(document.getElementById("qrcode"), { text: myProf.code, width: 160, height: 160 });

        // 2. ကင်မရာ စနစ် (အဝေး/အနီး ချိတ်ရန် environment mode သုံး)
        function startCamera() {
            document.getElementById('scanner-container').style.display = 'flex';
            scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (txt) => {
                stopCamera();
                checkAndJoin(txt);
            });
        }

        function stopCamera() {
            if(scanner) scanner.stop();
            document.getElementById('scanner-container').style.display = 'none';
        }

        // 3. Gallery မှ ပုံဖတ်ခြင်း
        function scanFile(input) {
            if(!input.files[0]) return;
            const reader = new Html5Qrcode("reader");
            reader.scanFile(input.files[0], true)
                .then(txt => checkAndJoin(txt))
                .catch(err => alert("❌ QR ပုံ ရှာမတွေ့ပါ"));
        }

        // 4. User ရှိ/မရှိ တိတိကျကျ စစ်ဆေးခြင်း
        async function checkAndJoin(targetCode) {
            if(!targetCode || targetCode === myProf.code) return alert("❌ Code မှားနေပါသည်");
            
            // Firebase တွင် တကယ်ရှိသော User ဟုတ်မဟုတ် စစ်ဆေးခြင်း
            const snap = await db.ref('users/' + targetCode).once('value');
            if(!snap.exists()) {
                alert("❌ ဤ Code ဖြင့် User ရှာမတွေ့ပါ။");
                return;
            }
            
            startBattle(targetCode);
        }

        function manualJoin() {
            checkAndJoin(document.getElementById('targetInput').value.trim());
        }

        // 5. Battle Page စတင်ခြင်း
        function startBattle(oppCode) {
            bId = myProf.code < oppCode ? `${myProf.code}_${oppCode}` : `${oppCode}_${myProf.code}`;
            
            // ကိုယ့်ဝင်ငွေကို Firebase ပို့ထား
            db.ref(`battles/${bId}/players/${myProf.code}`).set({ name: myProf.name, wage: myProf.wage || 0 });
            
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('battlePage').style.display = 'block';

            // Real-time Update
            db.ref(`battles/${bId}/players`).on('value', s => {
                const ps = s.val();
                if(ps && ps[oppCode]) {
                    const opp = ps[oppCode];
                    const me = ps[myProf.code];
                    document.getElementById('oppName').innerText = opp.name;
                    document.getElementById('myWage').innerText = me.wage.toFixed(0) + "฿";
                    document.getElementById('oppWage').innerText = opp.wage.toFixed(0) + "฿";
                    
                    const total = me.wage + opp.wage;
                    const perc = total > 0 ? (me.wage / total) * 100 : 50;
                    document.getElementById('vBar').style.width = perc + "%";
                    
                    document.getElementById('bStatus').innerText = me.wage > opp.wage ? "🔥 မင်းက အသာစီးရနေတယ်!" : "⚖️ အခြေအနေ တူညီနေသည်";
                }
            });

            // Chat Listen
            db.ref(`battles/${bId}/chats`).on('child_added', s => {
                const m = s.val();
                const div = document.createElement('div');
                div.className = `msg ${m.sender === myProf.code ? 'me' : 'him'}`;
                div.innerText = m.text;
                document.getElementById('chatBox').appendChild(div);
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
            });
        }

        // 6. စာပို့ခြင်း
        function sendMsg() {
            const txt = document.getElementById('msgInput').value;
            if(!txt || !bId) return;
            db.ref(`battles/${bId}/chats`).push({ sender: myProf.code, text: txt });
            document.getElementById('msgInput').value = '';
        }
    </script>
</body>
</html>
