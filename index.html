<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Wage Arena - Final Data Sync</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        :root { --blue: #1a2a6c; --red: #b21f1f; --gold: #ffd700; --dark: #0f1c3f; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, var(--dark), var(--blue)); color: #fff; min-height: 100vh; overflow-x: hidden; }
        
        .nav-bar { display: flex; align-items: center; background: linear-gradient(135deg, var(--blue), var(--red)); padding: 15px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .back-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding-right: 15px; }
        
        .card { background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(10px); border-radius: 15px; padding: 20px; margin: 15px; border: 1px solid rgba(255,255,255,0.1); }
        
        .my-id-box { text-align: center; border: 2px dashed var(--gold); padding: 10px; border-radius: 10px; margin-bottom: 20px; background: rgba(0,0,0,0.3); }
        .id-text { font-size: 22px; font-weight: 900; color: var(--gold); letter-spacing: 2px; }

        .hp-track { height: 30px; background: #000; border-radius: 15px; overflow: hidden; border: 2px solid var(--gold); display: flex; margin: 15px 0; position: relative; }
        .hp-fill { height: 100%; width: 50%; background: linear-gradient(90deg, #4caf50, var(--gold)); transition: 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .hp-center { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: white; opacity: 0.5; }

        .vs-grid { display: grid; grid-template-columns: 1fr 40px 1fr; align-items: center; text-align: center; }
        .wage-amt { font-size: 26px; font-weight: 900; color: var(--gold); text-shadow: 0 0 10px rgba(255,215,0,0.3); }
        .winner-tag { font-size: 10px; background: #4caf50; color: white; padding: 2px 6px; border-radius: 4px; display: none; margin-top: 5px; }

        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; color: white; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-red { background: #e11d48; }
        .btn-share { background: #059669; }

        input, select { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: #fff; text-align: center; }

        #notiPop { position: fixed; top: 70px; left: 15px; right: 15px; background: var(--gold); color: #000; padding: 20px; border-radius: 15px; z-index: 2000; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid #fff; }
        
        .chat-box { height: 120px; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 10px; padding: 10px; margin-bottom: 10px; font-size: 13px; border: 1px solid rgba(255,255,255,0.1); }
        .history-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <div id="notiPop">
        <h3 id="inviterName">🔔 စိန်ခေါ်မှု အသစ်!</h3>
        <p id="inviteDetail" style="font-size: 12px; margin: 10px 0;"></p>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-blue" style="margin:0; background:#2563eb; flex:1;" onclick="acceptInvite()">လက်ခံမည်</button>
            <button class="btn btn-red" style="margin:0; flex:1;" onclick="rejectInvite()">ငြင်းမည်</button>
        </div>
    </div>

    <div class="nav-bar">
        <button class="back-btn" onclick="goBack()">❮</button>
        <h2 id="title">BATTLE ARENA</h2>
    </div>

    <div id="setupArea">
        <div class="card">
            <div class="my-id-box">
                <p style="font-size: 11px; margin-bottom: 5px;">သင့်၏ Battle ID</p>
                <div class="id-text" id="myIdDisplay">------</div>
                <button onclick="copyMyId()" style="background:none; border:none; color:var(--gold); font-size:12px; text-decoration:underline;">Copy ID</button>
            </div>
            <h3 style="margin-bottom:10px;">ပြိုင်ဘက်ကို စိန်ခေါ်ရန်</h3>
            <input type="text" id="targetIdInput" placeholder="Battle ID ရိုက်ထည့်ပါ">
            <select id="duration">
                <option value="15">၁၅ ရက် ပြိုင်ပွဲ</option>
                <option value="30">ရက် ၃၀ ပြိုင်ပွဲ</option>
            </select>
            <button class="btn btn-gold" onclick="sendChallenge()">⚔️ စိန်ခေါ်မှု ပို့မည်</button>
        </div>
        <div class="card">
            <h3 style="margin-bottom:10px;">ပွဲမှတ်တမ်း</h3>
            <div id="historyList"><p style="text-align:center; opacity:0.5;">မှတ်တမ်းမရှိသေးပါ</p></div>
        </div>
    </div>

    <div id="battleArea" style="display:none;">
        <div class="card">
            <div class="vs-grid">
                <div id="p1Box">
                    <div id="p1Name" style="font-size:12px; opacity:0.8;">You</div>
                    <div class="wage-amt" id="p1Wage">0฿</div>
                    <span class="winner-tag" id="p1Win">🏆 အသာစီးရနေသည်</span>
                </div>
                <div style="font-weight:bold; color:var(--red); font-size:20px;">VS</div>
                <div id="p2Box">
                    <div id="p2Name" style="font-size:12px; opacity:0.8;">Opponent</div>
                    <div class="wage-amt" id="p2Wage">0฿</div>
                    <span class="winner-tag" id="p2Win">🏆 အသာစီးရနေသည်</span>
                </div>
            </div>

            <div class="hp-track">
                <div id="hpFill" class="hp-fill"></div>
                <div class="hp-center"></div>
            </div>
            
            <div class="chat-box" id="chatBox"></div>
            <div style="display:flex; gap:5px;">
                <input type="text" id="chatInput" placeholder="စာတို..." style="margin:0; text-align:left;">
                <button class="btn btn-gold" style="width:60px; margin:0;" onclick="sendChat()">ပို့</button>
            </div>
            
            <button class="btn btn-share" onclick="shareResult()" style="margin-top:15px;">📊 ဆိုရှယ်တင်မည်</button>
            <button class="btn btn-red" onclick="surrender()" style="margin-top:5px;">🏳️ အရှုံးပေးမည် / ထွက်မည်</button>
        </div>
    </div>

    <script>
        // 1. Firebase Config (အပြည့်အစုံ ထည့်သွင်းထားပါသည်)
        const firebaseConfig = {
            apiKey: "AIzaSyD7T7WZg0fLGTw6ShqDHjOva-btNF6O1AM",
            authDomain: "seafood-oder.firebaseapp.com",
            databaseURL: "https://seafood-oder-default-rtdb.firebaseio.com",
            projectId: "seafood-oder",
            storageBucket: "seafood-oder.firebasestorage.app",
            messagingSenderId: "428949391732",
            appId: "1:428949391732:web:6aa0a31a4f4ba33765c421",
            measurementId: "G-GY9TRMQ359"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. Initial Setup
        const profile = JSON.parse(localStorage.getItem('f_prof')) || { name: "Player", code: "N/A" };
        let myId = localStorage.getItem('battle_id_v4') || Math.random().toString(36).substring(2, 8).toUpperCase();
        localStorage.setItem('battle_id_v4', myId);
        document.getElementById('myIdDisplay').innerText = myId;

        let currentRoom = null;
        let myRole = null;
        let pendingRoom = null;
        let syncInterval = null;

        // Auto-Reconnect to active room
        const activeRoomId = localStorage.getItem('active_room_id');
        if (activeRoomId) {
            currentRoom = activeRoomId;
            myRole = localStorage.getItem('my_role');
            startBattleUI();
        }

        // 3. Robust Data Calculation Logic (Data သေချာဝင်စေရန်)
        function calculateWage(days) {
            // Local Storage ထဲက data အားလုံးကို အရင်ရှာပါမယ်
            const records = JSON.parse(localStorage.getItem('f_records')) || JSON.parse(localStorage.getItem('f_recs'));
            let totalWage = 0;

            if (Array.isArray(records) && records.length > 0) {
                const cutoff = new Date();
                cutoff.setDate(cutoff.getDate() - parseInt(days));
                
                records.forEach(r => {
                    let rDate = new Date(r.date || r.timestamp || new Date());
                    if (rDate >= cutoff) {
                        totalWage += (Number(r.basic_wage || 0) + Number(r.ot_pay || 0) + Number(r.extra || 0) + Number(r.amount || 0));
                    }
                });
            } else {
                // အကယ်၍ Home Page က f_prof ထဲမှာသာ wage သိမ်းထားလျှင်
                const prof = JSON.parse(localStorage.getItem('f_prof'));
                if (prof && prof.wage) {
                    totalWage = Number(prof.wage);
                }
            }
            return totalWage;
        }

        // 4. Invite Listeners
        db.ref(`invites/${myId}`).on('value', snap => {
            if (snap.exists()) {
                const inv = snap.val();
                document.getElementById('inviterName').innerText = `🔔 ${inv.fromName} မှ စိန်ခေါ်မှု!`;
                document.getElementById('inviteDetail').innerText = `ပြိုင်ပွဲကာလ: ${inv.days} ရက်\nအချိန်: ${new Date(inv.time).toLocaleTimeString()}`;
                pendingRoom = inv.roomCode;
                document.getElementById('notiPop').style.display = 'block';
            } else {
                document.getElementById('notiPop').style.display = 'none';
            }
        });

        // 5. Send Challenge
        async function sendChallenge() {
            const tid = document.getElementById('targetIdInput').value.trim().toUpperCase();
            if (!tid || tid === myId) return alert("ID မှားနေပါသည်");
            
            const days = document.getElementById('duration').value;
            const rCode = "BATTLE-" + Date.now().toString().slice(-6);
            const myWage = calculateWage(days);

            await db.ref(`rooms/${rCode}`).set({
                config: { days, start: new Date().toISOString(), status: 'waiting' },
                p1: { name: profile.name, wage: myWage, id: myId }
            });

            await db.ref(`invites/${tid}`).set({ fromName: profile.name, roomCode: rCode, days: days, time: Date.now() });
            currentRoom = rCode; myRole = 'p1';
            localStorage.setItem('active_room_id', rCode);
            localStorage.setItem('my_role', 'p1');
            startBattleUI();
        }

        function acceptInvite() {
            joinRoom(pendingRoom);
            db.ref(`invites/${myId}`).remove();
        }
        function rejectInvite() { db.ref(`invites/${myId}`).remove(); }

        async function joinRoom(rc) {
            const snap = await db.ref(`rooms/${rc}`).once('value');
            if (!snap.exists()) return alert("ပွဲမရှိတော့ပါ");
            currentRoom = rc; myRole = 'p2';
            localStorage.setItem('active_room_id', rc);
            localStorage.setItem('my_role', 'p2');
            const myWage = calculateWage(snap.val().config.days);
            await db.ref(`rooms/${rc}/p2`).set({ name: profile.name, wage: myWage, id: myId });
            await db.ref(`rooms/${rc}/config/status`).set('active');
            startBattleUI();
        }

        // 6. Real-time Battle UI & Auto-Sync
        function startBattleUI() {
            document.getElementById('setupArea').style.display = 'none';
            document.getElementById('battleArea').style.display = 'block';

            db.ref(`rooms/${currentRoom}`).on('value', snap => {
                const data = snap.val();
                if (!data) return handleRoomClosed();

                const p1 = data.p1 || { name: "Player 1", wage: 0 };
                const p2 = data.p2 || { name: "စောင့်နေဆဲ...", wage: 0 };
                
                // Display Names and Wages
                document.getElementById('p1Name').innerText = p1.name;
                document.getElementById('p1Wage').innerText = Math.round(p1.wage) + "฿";
                document.getElementById('p2Name').innerText = p2.name;
                document.getElementById('p2Wage').innerText = Math.round(p2.wage) + "฿";

                // Compare & Update HP Bar (A vs B)
                const total = p1.wage + p2.wage;
                const p1Perc = total > 0 ? (p1.wage / total) * 100 : 50;
                document.getElementById('hpFill').style.width = p1Perc + "%";

                // Show Winner Real-time Logic (A=B Results)
                document.getElementById('p1Win').style.display = p1.wage > p2.wage ? 'inline-block' : 'none';
                document.getElementById('p2Win').style.display = p2.wage > p1.wage ? 'inline-block' : 'none';
                
                // Keep my data synced initially
                if (data.config) syncMyWage(data.config.days);
            });

            // Start an aggressive 5-second interval to pull Home Page changes automatically
            if (!syncInterval) {
                syncInterval = setInterval(() => {
                    db.ref(`rooms/${currentRoom}/config`).once('value', s => {
                        const conf = s.val();
                        if(conf) syncMyWage(conf.days);
                    });
                }, 5000);
            }

            // Chat Sync
            db.ref(`rooms/${currentRoom}/chats`).on('child_added', s => {
                const c = s.val();
                const div = document.createElement('div');
                div.style.marginBottom = "5px";
                div.innerHTML = `<b style="color:var(--gold)">${c.name}:</b> ${c.text}`;
                document.getElementById('chatBox').appendChild(div);
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
            });
        }

        function syncMyWage(days) {
            const latestWage = calculateWage(days);
            db.ref(`rooms/${currentRoom}/${myRole}/wage`).set(latestWage);
        }

        function sendChat() {
            const txt = document.getElementById('chatInput').value;
            if (txt) {
                db.ref(`rooms/${currentRoom}/chats`).push({ name: profile.name, text: txt });
                document.getElementById('chatInput').value = "";
            }
        }

        function surrender() {
            if (confirm("ပွဲမှ ထွက်မှာ သေချာလား?")) {
                saveHistory();
                db.ref(`rooms/${currentRoom}`).remove();
                handleRoomClosed();
            }
        }

        function saveHistory() {
            const hist = JSON.parse(localStorage.getItem('battle_history')) || [];
            db.ref(`rooms/${currentRoom}`).once('value', snap => {
                const d = snap.val();
                if (!d || !d.p2) return;
                const win = (myRole === 'p1' ? d.p1.wage > d.p2.wage : d.p2.wage > d.p1.wage);
                hist.unshift({ opp: (myRole === 'p1' ? d.p2.name : d.p1.name), result: win ? 'WIN' : 'LOSE', date: new Date().toLocaleDateString() });
                localStorage.setItem('battle_history', JSON.stringify(hist.slice(0, 5)));
            });
        }

        function handleRoomClosed() {
            if (syncInterval) clearInterval(syncInterval);
            localStorage.removeItem('active_room_id');
            localStorage.removeItem('my_role');
            location.reload();
        }

        function shareResult() {
            const txt = `Battle Wage မှာ ကျွန်တော် ပြိုင်နေပါတယ်။\nBattle ID: ${myId} နဲ့ လာစိန်ခေါ်လိုက်ပါ!`;
            navigator.share ? navigator.share({text: txt}) : alert("Copied to clipboard!");
        }

        function copyMyId() { navigator.clipboard.writeText(myId); alert("ID Copied!"); }
        function goBack() { window.history.back(); }

        // History Load
        function loadHistory() {
            const hist = JSON.parse(localStorage.getItem('battle_history')) || [];
            const container = document.getElementById('historyList');
            if (hist.length > 0) {
                container.innerHTML = hist.map(h => `
                    <div class="history-item">
                        <span>vs ${h.opp}</span>
                        <span style="color:${h.result === 'WIN' ? '#4caf50' : '#f44336'}">${h.result}</span>
                    </div>
                `).join('');
            }
        }
        window.onload = loadHistory;
    </script>
</body>
</html>
