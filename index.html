<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Wage Arena</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        :root { --blue: #1a2a6c; --red: #b21f1f; --gold: #ffd700; --dark: #0f1c3f; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, var(--dark), var(--blue)); color: #fff; min-height: 100vh; overflow-x: hidden; }
        .nav-bar { display: flex; align-items: center; background: linear-gradient(135deg, var(--blue), var(--red)); padding: 15px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .back-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding-right: 15px; }
        .card { background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(10px); border-radius: 15px; padding: 20px; margin: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .my-id-box { text-align: center; border: 2px dashed var(--gold); padding: 10px; border-radius: 10px; margin-bottom: 20px; background: rgba(0,0,0,0.3); }
        .id-text { font-size: 22px; font-weight: 900; color: var(--gold); letter-spacing: 2px; }
        .hp-track { height: 35px; background: #000; border-radius: 20px; overflow: hidden; border: 2px solid var(--gold); display: flex; margin: 15px 0; position: relative; box-shadow: inset 0 0 10px #000; }
        .hp-fill { height: 100%; width: 50%; background: linear-gradient(90deg, #4caf50, var(--gold)); transition: 1s ease-in-out; position: relative; }
        .hp-center { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: white; opacity: 0.5; z-index: 10; }
        .vs-grid { display: grid; grid-template-columns: 1fr 40px 1fr; align-items: center; text-align: center; margin-bottom: 10px; }
        .wage-amt { font-size: 26px; font-weight: 900; color: var(--gold); }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; color: white; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-red { background: #e11d48; }
        .btn-share { background: #059669; }
        #notiPop { position: fixed; top: 70px; left: 15px; right: 15px; background: var(--gold); color: #000; padding: 20px; border-radius: 15px; z-index: 2000; display: none; border: 2px solid #fff; text-align: center; }
        .chat-box { height: 120px; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 10px; padding: 10px; margin-bottom: 10px; font-size: 13px; }
        .winner-tag { font-size: 10px; background: #4caf50; color: white; padding: 2px 6px; border-radius: 4px; display: none; margin-top: 5px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: #fff; text-align: center; }
    </style>
</head>
<body>

    <div id="notiPop">
        <h3 id="invName">🔔 စိန်ခေါ်မှု အသစ်!</h3>
        <p id="invDetail" style="margin:10px 0; font-size:12px;"></p>
        <div style="display:flex; gap:10px;">
            <button class="btn" style="background:#2563eb; margin:0; flex:1;" onclick="acceptInvite()">လက်ခံမည်</button>
            <button class="btn btn-red" style="margin:0; flex:1;" onclick="rejectInvite()">ငြင်းမည်</button>
        </div>
    </div>

    <div class="nav-bar">
        <button class="back-btn" onclick="goBack()">❮</button>
        <h2>BATTLE ARENA</h2>
    </div>

    <div id="setupArea">
        <div class="card">
            <div class="my-id-box">
                <p style="font-size: 11px;">သင့်၏ Battle ID</p>
                <div class="id-text" id="myIdDisplay">------</div>
                <button onclick="copyMyId()" style="color:var(--gold); font-size:12px; background:none; border:none; text-decoration:underline;">Copy ID</button>
            </div>
            <input type="text" id="targetId" placeholder="ပြိုင်ဘက် ID ရိုက်ထည့်ပါ">
            <select id="duration">
                <option value="15">၁၅ ရက် ပြိုင်ပွဲ</option>
                <option value="30">ရက် ၃၀ ပြိုင်ပွဲ</option>
            </select>
            <button class="btn btn-gold" onclick="sendChallenge()">⚔️ စိန်ခေါ်မည်</button>
        </div>
    </div>

    <div id="battleArea" style="display:none;">
        <div class="card">
            <div class="vs-grid">
                <div>
                    <div id="p1Name" style="font-size:12px;">You</div>
                    <div class="wage-amt" id="p1Wage">0฿</div>
                    <span class="winner-tag" id="p1Win">WINNER</span>
                </div>
                <div style="font-weight:bold; color:var(--red);">VS</div>
                <div>
                    <div id="p2Name" style="font-size:12px;">Opponent</div>
                    <div class="wage-amt" id="p2Wage">0฿</div>
                    <span class="winner-tag" id="p2Win">WINNER</span>
                </div>
            </div>
            <div class="hp-track">
                <div id="hpFill" class="hp-fill"></div>
                <div class="hp-center"></div>
            </div>
            <div class="chat-box" id="chatBox"></div>
            <div style="display:flex; gap:5px;">
                <input type="text" id="chatInput" placeholder="စာတို..." style="margin:0; flex:1; text-align:left;">
                <button class="btn btn-gold" style="width:60px; margin:0;" onclick="sendChat()">ပို့</button>
            </div>
            <button class="btn btn-share" style="margin-top:20px;" onclick="shareResult()">📊 ဆိုရှယ်တင်မည်</button>
            <button class="btn btn-red" onclick="surrender()">🏳️ အရှုံးပေး/ထွက်မည်</button>
        </div>
    </div>

    <script>
        // --- ၁။ သင်၏ Firebase Config အပြည့်အစုံ ---
        const firebaseConfig = {
            apiKey: "AIzaSyD7T7WZg0fLGTw6ShqDHjOva-btNF6O1AM",
            authDomain: "seafood-oder.firebaseapp.com",
            databaseURL: "https://seafood-oder-default-rtdb.firebaseio.com",
            projectId: "seafood-oder",
            storageBucket: "seafood-oder.firebasestorage.app",
            messagingSenderId: "428949391732",
            appId: "1:428949391732:web:6aa0a31a4f4ba33765c421",
            measurementId: "G-GY9TRMQ359"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- ၂။ Identity & User Data ---
        const getHomeData = () => JSON.parse(localStorage.getItem('f_records')) || JSON.parse(localStorage.getItem('f_recs')) || [];
        const profile = JSON.parse(localStorage.getItem('f_prof')) || { name: "Player", code: "000" };
        
        let myId = localStorage.getItem('battle_id_v3') || Math.random().toString(36).substring(2, 8).toUpperCase();
        localStorage.setItem('battle_id_v3', myId);
        document.getElementById('myIdDisplay').innerText = myId;

        let currentRoom = localStorage.getItem('active_room');
        let myRole = localStorage.getItem('my_role');
        let inviteData = null;
        let syncInterval = null;
        let lastPushedWage = -1; // နောက်ဆုံးပို့ခဲ့တဲ့လစာကို မှတ်ထားရန်

        // --- ၃။ ဝင်ငွေတွက်ချက်ခြင်း ---
        function calculateWage(days) {
            const records = getHomeData();
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - parseInt(days));
            
            return records.reduce((sum, r) => {
                const rDate = new Date(r.date);
                if (rDate >= cutoff) {
                    return sum + (Number(r.basic_wage || 0) + Number(r.ot_pay || 0) + Number(r.extra || 0));
                }
                return sum;
            }, 0);
        }

        // --- ၄။ Notification နားထောင်ခြင်း ---
        db.ref(`invites/${myId}`).on('value', snap => {
            if (snap.exists()) {
                inviteData = snap.val();
                document.getElementById('invName').innerText = `🔔 ${inviteData.fromName} မှ စိန်ခေါ်မှု!`;
                document.getElementById('invDetail').innerText = `${inviteData.days} ရက်ပြိုင်ပွဲ\nအချိန်: ${new Date(inviteData.time).toLocaleTimeString()}`;
                document.getElementById('notiPop').style.display = 'block';
            } else {
                document.getElementById('notiPop').style.display = 'none';
            }
        });

        // --- ၅။ စိန်ခေါ်ခြင်း နှင့် လက်ခံခြင်း ---
        async function sendChallenge() {
            const tid = document.getElementById('targetId').value.trim().toUpperCase();
            if(!tid || tid === myId) return alert("ID မှားနေပါသည်");
            const days = document.getElementById('duration').value;
            const rCode = "R-" + Date.now().toString().slice(-6);
            
            currentRoom = rCode; myRole = 'p1';
            localStorage.setItem('active_room', rCode);
            localStorage.setItem('my_role', 'p1');

            await db.ref(`rooms/${rCode}`).set({
                config: { days, status: 'waiting', start: Date.now() },
                p1: { name: profile.name, wage: calculateWage(days), id: myId }
            });
            await db.ref(`invites/${tid}`).set({ fromName: profile.name, roomCode: rCode, days, time: Date.now() });
            startBattleUI();
        }

        async function acceptInvite() {
            const rc = inviteData.roomCode;
            const snap = await db.ref(`rooms/${rc}`).once('value');
            if(!snap.exists()) return alert("ပွဲမရှိတော့ပါ");

            currentRoom = rc; myRole = 'p2';
            localStorage.setItem('active_room', rc);
            localStorage.setItem('my_role', 'p2');

            await db.ref(`rooms/${rc}/p2`).set({ name: profile.name, wage: calculateWage(snap.val().config.days), id: myId });
            await db.ref(`rooms/${rc}/config/status`).set('active');
            db.ref(`invites/${myId}`).remove();
            startBattleUI();
        }

        // --- ၆။ UI ပြသခြင်း နှင့် Data Auto-Push လုပ်ခြင်း ---
        function startBattleUI() {
            document.getElementById('setupArea').style.display = 'none';
            document.getElementById('battleArea').style.display = 'block';

            // Firebase မှ ပြောင်းလဲမှုများကို UI တွင်ပြခြင်း
            db.ref(`rooms/${currentRoom}`).on('value', snap => {
                const data = snap.val();
                if(!data) return handleExit();

                const p1 = data.p1;
                const p2 = data.p2 || { name: "Waiting...", wage: 0 };
                
                document.getElementById('p1Name').innerText = p1.name;
                document.getElementById('p1Wage').innerText = Math.round(p1.wage) + "฿";
                document.getElementById('p2Name').innerText = p2.name;
                document.getElementById('p2Wage').innerText = Math.round(p2.wage) + "฿";

                // HP Bar တွက်ချက်ခြင်း
                const total = p1.wage + p2.wage;
                document.getElementById('hpFill').style.width = total > 0 ? (p1.wage / total * 100) + "%" : "50%";
                
                // Winner စာတန်းပြခြင်း
                document.getElementById('p1Win').style.display = p1.wage > p2.wage ? 'inline-block' : 'none';
                document.getElementById('p2Win').style.display = p2.wage > p1.wage ? 'inline-block' : 'none';
            });

            // Chat ဖတ်ခြင်း
            db.ref(`rooms/${currentRoom}/chats`).on('child_added', s => {
                const c = s.val();
                const div = document.createElement('div');
                div.style.marginBottom = "5px";
                div.innerHTML = `<b style="color:var(--gold)">${c.name}:</b> ${c.text}`;
                document.getElementById('chatBox').appendChild(div);
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
            });

            // 🌟 ဤနေရာသည် Home Data ကို အချိန်နှင့်တပြေးညီ ပို့ပေးမည့် အပိုင်းဖြစ်သည်
            if (syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(() => {
                db.ref(`rooms/${currentRoom}/config/days`).once('value', snap => {
                    const days = snap.val();
                    if (days) {
                        const currentWage = calculateWage(days);
                        // Home Page တွင် Data အသစ်ဝင်မှသာ Firebase သို့ လှမ်းပို့မည် (Data သက်သာစေရန်)
                        if (currentWage !== lastPushedWage) {
                            db.ref(`rooms/${currentRoom}/${myRole}`).update({
                                wage: currentWage,
                                name: profile.name,
                                lastUpdate: Date.now()
                            });
                            lastPushedWage = currentWage; // မှတ်ထားလိုက်မည်
                        }
                    }
                });
            }, 3000); // ၃ စက္ကန့်တစ်ခါ Local Storage ကို စစ်ဆေးမည်
        }

        // --- ၇။ အခြားလုပ်ဆောင်ချက်များ ---
        function sendChat() {
            const txt = document.getElementById('chatInput').value;
            if(txt) {
                db.ref(`rooms/${currentRoom}/chats`).push({ name: profile.name, text: txt });
                document.getElementById('chatInput').value = "";
            }
        }

        function surrender() {
            if(confirm("ပွဲမှ ထွက်မှာ သေချာလား?")) {
                db.ref(`rooms/${currentRoom}`).remove();
                handleExit();
            }
        }

        function handleExit() {
            localStorage.removeItem('active_room');
            localStorage.removeItem('my_role');
            if (syncInterval) clearInterval(syncInterval);
            location.reload();
        }

        function shareResult() {
            const txt = `Battle Wage မှာ ကျွန်တော် ပြိုင်နေပါတယ်။\nBattle ID: ${myId} နဲ့ လာစိန်ခေါ်လိုက်ပါ!`;
            navigator.share ? navigator.share({text: txt}) : alert("Copied to clipboard!");
        }

        function rejectInvite() { db.ref(`invites/${myId}`).remove(); }
        function copyMyId() { navigator.clipboard.writeText(myId); alert("ID Copied!"); }
        function goBack() { window.history.back(); }

        // Auto Reconnect (Refresh လုပ်လျှင် ပွဲမပျက်စေရန်)
        if(currentRoom) startBattleUI();
    </script>
</body>
</html>
