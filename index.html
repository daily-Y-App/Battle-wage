<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚔️ Battle Arena Pro</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #1a2a6c; --secondary: #b21f1f; --bg: #f0f2f5; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 10px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 15px; text-align: center; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-blue { background: #2563eb; }
        .btn-red { background: var(--secondary); }
        #reader { width: 100%; border-radius: 10px; overflow: hidden; display: none; }
        .chat-box { height: 150px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-top: 10px; text-align: left; background: #fafafa; border-radius: 10px; }
        .msg { margin-bottom: 5px; padding: 5px 10px; border-radius: 5px; font-size: 14px; }
        .msg.me { background: #dcf8c6; text-align: right; }
        .msg.him { background: #fff; border: 1px solid #eee; }
    </style>
</head>
<body>

    <div class="card">
        <h2>⚔️ Battle Arena</h2>
        <p>သင့်ရဲ့ Code: <b id="myCodeDisplay">...</b></p>
        <div id="qrcode" style="display: flex; justify-content: center; margin: 15px 0;"></div>
        <button class="btn btn-blue" onclick="startScan()">📷 QR Scan ဖတ်ပြီး စိန်ခေါ်မည်</button>
        <div id="reader"></div>
    </div>

    <div class="card">
        <h3>🔍 Code ဖြင့် ရှာဖွေမည်</h3>
        <input type="text" id="oppCode" placeholder="သူငယ်ချင်း၏ Code ကိုရိုက်ပါ" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
        <button class="btn btn-red" onclick="connectBattle(document.getElementById('oppCode').value)">⚔️ Battle စတင်မည်</button>
    </div>

    <div id="battleUI" class="card" style="display:none;">
        <h3 id="battleStatus">⚔️ တိုက်ပွဲစတင်နေပြီ</h3>
        <div id="vsArea" style="font-size: 20px; font-weight: bold; margin: 15px 0;"></div>
        
        <div class="chat-box" id="chatBox"></div>
        <div style="display:flex; gap:5px; margin-top:10px;">
            <input type="text" id="msgInput" placeholder="စာပို့ရန်..." style="flex:1; padding:8px; border-radius:5px; border:1px solid #ddd;">
            <button onclick="sendMsg()" style="padding:8px 15px; border-radius:5px; background:var(--primary); color:white; border:none;">ပို့</button>
        </div>
    </div>

    <script>
        // Firebase Config (သင်၏ Config ကို ပြန်သုံးပါ)
        const firebaseConfig = {
            apiKey: "AIzaSyD7T7WZg0fLGTw6ShqDHjOva-btNF6O1AM",
            authDomain: "seafood-oder.firebaseapp.com",
            databaseURL: "https://seafood-oder-default-rtdb.firebaseio.com",
            projectId: "seafood-oder",
            storageBucket: "seafood-oder.firebasestorage.app",
            messagingSenderId: "428949391732",
            appId: "1:428949391732:web:6aa0a31a4f4ba33765c421"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Local Data
        let myProfile = JSON.parse(localStorage.getItem('f_prof')) || { name: 'User', code: 'EMP001' };
        let battleId = null;

        document.getElementById('myCodeDisplay').innerText = myProfile.code;

        // 1. QR Code ထုတ်ပေးခြင်း
        new QRCode(document.getElementById("qrcode"), {
            text: myProfile.code,
            width: 128,
            height: 128
        });

        // 2. QR Scanner ဖွင့်ခြင်း
        function startScan() {
            document.getElementById('reader').style.display = 'block';
            const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            scanner.render((decodedText) => {
                scanner.clear();
                document.getElementById('reader').style.display = 'none';
                connectBattle(decodedText);
            });
        }

        // 3. Battle ချိတ်ဆက်ခြင်း
        function connectBattle(oppCode) {
            if(!oppCode) return alert("Code ရိုက်ပါ");
            battleId = myProfile.code < oppCode ? `${myProfile.code}_${oppCode}` : `${oppCode}_${myProfile.code}`;
            
            document.getElementById('battleUI').style.display = 'block';
            
            // တစ်ဖက်လူရဲ့ Data ကို နားထောင်ခြင်း
            db.ref('users/' + oppCode + '/profile').on('value', snap => {
                const opp = snap.val();
                if(opp) {
                    document.getElementById('vsArea').innerText = `${myProfile.name} VS ${opp.name}`;
                }
            });

            // Chat ကို နားထောင်ခြင်း
            db.ref('battles/' + battleId + '/chats').on('child_added', snap => {
                const m = snap.val();
                const div = document.createElement('div');
                div.className = `msg ${m.sender === myProfile.code ? 'me' : 'him'}`;
                div.innerText = m.text;
                document.getElementById('chatBox').appendChild(div);
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
            });
        }

        // 4. စာပို့ခြင်း
        function sendMsg() {
            const text = document.getElementById('msgInput').value;
            if(!text || !battleId) return;
            db.ref('battles/' + battleId + '/chats').push({
                sender: myProfile.code,
                text: text,
                time: Date.now()
            });
            document.getElementById('msgInput').value = '';
        }
    </script>
</body>
</html>
