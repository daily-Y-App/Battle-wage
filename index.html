<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Battle Wage Arena</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        :root { --blue: #1a2a6c; --red: #b21f1f; --gold: #ffd700; --dark: #0f1c3f; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, var(--dark), var(--blue)); color: #fff; min-height: 100vh; overflow-x: hidden; }
        
        /* Navigation & Header */
        .nav-bar { display: flex; align-items: center; background: linear-gradient(135deg, var(--blue), var(--red)); padding: 15px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .back-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; padding-right: 15px; }
        
        .card { background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(10px); border-radius: 15px; padding: 20px; margin: 15px; border: 1px solid rgba(255,255,255,0.1); }
        
        /* Battle Identity */
        .my-id-box { text-align: center; border: 2px dashed var(--gold); padding: 10px; border-radius: 10px; margin-bottom: 20px; background: rgba(0,0,0,0.3); }
        .id-text { font-size: 22px; font-weight: 900; color: var(--gold); letter-spacing: 2px; }

        /* HP Bar & VS */
        .hp-track { height: 25px; background: #000; border-radius: 15px; overflow: hidden; border: 1px solid var(--gold); display: flex; margin: 15px 0; }
        .hp-fill { height: 100%; width: 50%; background: linear-gradient(90deg, #4caf50, var(--gold)); transition: 1s ease-in-out; }
        .vs-grid { display: grid; grid-template-columns: 1fr 40px 1fr; align-items: center; text-align: center; }
        .wage-amt { font-size: 24px; font-weight: 900; color: var(--gold); }

        /* Buttons */
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; color: white; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-blue { background: #2563eb; }
        .btn-red { background: #e11d48; }
        .btn-share { background: #059669; }

        input, select { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: #fff; text-align: center; }

        /* Notification Popup */
        #notiPop { position: fixed; top: 70px; left: 15px; right: 15px; background: var(--gold); color: #000; padding: 20px; border-radius: 15px; z-index: 2000; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; border: 2px solid #fff; }
        
        .chat-box { height: 120px; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 10px; padding: 10px; margin-bottom: 10px; font-size: 13px; }
        .log-list { font-size: 11px; color: #cbd5e1; height: 60px; overflow-y: auto; }
        
        /* History Table */
        .history-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 12px; }
    </style>
</head>
<body>

    <div id="notiPop">
        <h3 id="inviterMsg">🔔 စိန်ခေါ်မှု ရောက်ရှိနေပါသည်!</h3>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn btn-blue" style="margin:0;" onclick="acceptInvite()">လက်ခံမည်</button>
            <button class="btn btn-red" style="margin:0;" onclick="rejectInvite()">ငြင်းမည်</button>
        </div>
    </div>

    <div class="nav-bar">
        <button class="back-btn" onclick="goBack()">❮</button>
        <h2 id="title">BATTLE ARENA</h2>
    </div>

    <div id="setupArea">
        <div class="card">
            <div class="my-id-box">
                <p style="font-size: 11px; margin-bottom: 5px;">သင့်၏ Battle ID (ဤကုဒ်ကို ရှဲပေးပါ)</p>
                <div class="id-text" id="myIdDisplay">------</div>
                <button onclick="copyMyId()" style="background:none; border:none; color:var(--gold); font-size:12px; text-decoration:underline;">Copy ID</button>
            </div>

            <h3 style="margin-bottom:10px;">ပြိုင်ဘက်ကို စိန်ခေါ်ရန်</h3>
            <input type="text" id="targetIdInput" placeholder="ပြိုင်ဘက်၏ Battle ID ကိုရိုက်ထည့်ပါ">
            <select id="duration">
                <option value="15">၁၅ ရက် ပြိုင်ပွဲ</option>
                <option value="30">ရက် ၃၀ ပြိုင်ပွဲ</option>
            </select>
            <button class="btn btn-gold" onclick="sendChallenge()">⚔️ စိန်ခေါ်မှုပေးပို့မည်</button>
        </div>

        <div class="card">
            <h3 style="margin-bottom:10px;">နိုင်ရှုံးမှတ်တမ်း (History)</h3>
            <div id="historyList">
                <p style="text-align:center; opacity:0.5; font-size:12px;">မှတ်တမ်းမရှိသေးပါ</p>
            </div>
        </div>
    </div>

    <div id="battleArea" style="display:none;">
        <div class="card">
            <div class="vs-grid">
                <div>
                    <div id="p1Name" style="font-size:12px;">You</div>
                    <div class="wage-amt" id="p1Wage">0฿</div>
                </div>
                <div style="font-weight:bold; color:var(--red); font-size:20px;">VS</div>
                <div>
                    <div id="p2Name" style="font-size:12px;">Opponent</div>
                    <div class="wage-amt" id="p2Wage">0฿</div>
                </div>
            </div>

            <div class="hp-track"><div id="hpFill" class="hp-fill"></div></div>
            
            <div class="chat-box" id="chatBox"></div>
            <div style="display:flex; gap:5px; margin-bottom:10px;">
                <input type="text" id="chatInput" placeholder="စာတို..." style="margin:0; text-align:left;">
                <button class="btn btn-gold" style="width:60px; margin:0;" onclick="sendChat()">ပို့</button>
            </div>

            <div class="log-list" id="logList"></div>
            
            <button class="btn btn-share" onclick="shareResult()" style="margin-top:15px;">📊 ရလဒ်ကို ဆိုရှယ်တင်မည်</button>
            <button class="btn btn-red" onclick="surrender()">🏳️ အရှုံးပေးမည်/ထွက်မည်</button>
        </div>
    </div>

    <script>
        const fbConfig = { databaseURL: "https://seafood-oder-default-rtdb.firebaseio.com" };
        firebase.initializeApp(fbConfig);
        const db = firebase.database();

        const profile = JSON.parse(localStorage.getItem('f_prof')) || { name: "User", code: "Unknown" };
        let myId = localStorage.getItem('battle_id_v2') || Math.random().toString(36).substring(2, 8).toUpperCase();
        localStorage.setItem('battle_id_v2', myId);
        document.getElementById('myIdDisplay').innerText = myId;

        let currentRoom = null;
        let myRole = null;
        let pendingRoom = null;

        // 1. Listen for Challenges
        db.ref(`invites/${myId}`).on('value', snap => {
            if (snap.exists()) {
                const invite = snap.val();
                document.getElementById('inviterMsg').innerText = `🔔 ${invite.fromName} မှ စိန်ခေါ်နေပါသည်!`;
                pendingRoom = invite.roomCode;
                document.getElementById('notiPop').style.display = 'block';
            } else {
                document.getElementById('notiPop').style.display = 'none';
            }
        });

        // 2. Send Challenge (တစ်ဖက်လူ ID ရိုက်ထည့်ခြင်း)
        async function sendChallenge() {
            const targetId = document.getElementById('targetIdInput').value.trim().toUpperCase();
            if (!targetId || targetId === myId) return alert("ID အမှန်ရိုက်ထည့်ပါ");

            const days = document.getElementById('duration').value;
            const roomCode = "ROOM-" + Math.random().toString(36).substring(2, 6).toUpperCase();
            const myWage = calculateWage(days);

            await db.ref(`rooms/${roomCode}`).set({
                config: { days, start: new Date().toISOString(), status: 'waiting' },
                p1: { name: profile.name, wage: myWage, id: myId },
                logs: [{ msg: `${profile.name} မှ အခန်းဖွင့်လိုက်ပြီ။`, time: Date.now() }]
            });

            await db.ref(`invites/${targetId}`).set({ fromName: profile.name, roomCode: roomCode });
            currentRoom = roomCode;
            myRole = 'p1';
            alert("စိန်ခေါ်မှု ပို့လိုက်ပါပြီ။ တစ်ဖက်လူလက်ခံမှ ပွဲစပါမည်။");
            startBattleUI();
        }

        // 3. Accept/Reject
        function acceptInvite() {
            joinRoom(pendingRoom);
            db.ref(`invites/${myId}`).remove();
        }
        function rejectInvite() { db.ref(`invites/${myId}`).remove(); }

        async function joinRoom(roomCode) {
            const snap = await db.ref(`rooms/${roomCode}`).once('value');
            if (!snap.exists()) return alert("ပွဲမရှိတော့ပါ။");
            
            currentRoom = roomCode;
            myRole = 'p2';
            const myWage = calculateWage(snap.val().config.days);
            
            await db.ref(`rooms/${roomCode}/p2`).set({ name: profile.name, wage: myWage, id: myId });
            await db.ref(`rooms/${roomCode}/config/status`).set('active');
            pushLog(`${profile.name} မှ တိုက်ပွဲသို့ ဝင်လာပြီ!`);
            startBattleUI();
        }

        function calculateWage(days) {
            const records = JSON.parse(localStorage.getItem('f_records')) || [];
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - parseInt(days));
            return records.reduce((total, r) => {
                if (new Date(r.date) >= cutoff) return total + (parseFloat(r.basic_wage || 0) + parseFloat(r.ot_pay || 0) + parseFloat(r.extra || 0));
                return total;
            }, 0);
        }

        function startBattleUI() {
            document.getElementById('setupArea').style.display = 'none';
            document.getElementById('battleArea').style.display = 'block';
            
            db.ref(`rooms/${currentRoom}`).on('value', snap => {
                const data = snap.val();
                if (!data) return;
                const p1 = data.p1;
                const p2 = data.p2 || { name: "စောင့်နေဆဲ...", wage: 0 };
                
                document.getElementById('p1Name').innerText = p1.name;
                document.getElementById('p1Wage').innerText = Math.round(p1.wage) + "฿";
                document.getElementById('p2Name').innerText = p2.name;
                document.getElementById('p2Wage').innerText = Math.round(p2.wage) + "฿";

                const total = p1.wage + p2.wage;
                document.getElementById('hpFill').style.width = total > 0 ? (p1.wage / total * 100) + "%" : "50%";
            });

            db.ref(`rooms/${currentRoom}/logs`).on('child_added', s => {
                const div = document.createElement('div');
                div.innerText = `> ${s.val().msg}`;
                document.getElementById('logList').prepend(div);
            });
            
            loadHistory();
        }

        function sendChat() {
            const txt = document.getElementById('chatInput').value;
            if (txt) {
                db.ref(`rooms/${currentRoom}/chats`).push({ name: profile.name, text: txt });
                document.getElementById('chatInput').value = "";
            }
        }

        function pushLog(msg) { db.ref(`rooms/${currentRoom}/logs`).push({ msg, time: Date.now() }); }

        function surrender() {
            if (confirm("ပွဲမှ ထွက်မှာ သေချာလား? (မှတ်တမ်းဝင်သွားပါမည်)")) {
                saveToHistory();
                db.ref(`rooms/${currentRoom}`).remove();
                location.reload();
            }
        }

        function saveToHistory() {
            const hist = JSON.parse(localStorage.getItem('battle_history')) || [];
            db.ref(`rooms/${currentRoom}`).once('value', snap => {
                const d = snap.val();
                if (!d || !d.p2) return;
                const win = (myRole === 'p1' ? d.p1.wage > d.p2.wage : d.p2.wage > d.p1.wage);
                hist.unshift({ opp: (myRole === 'p1' ? d.p2.name : d.p1.name), result: win ? 'WIN' : 'LOSE', date: new Date().toLocaleDateString() });
                localStorage.setItem('battle_history', JSON.stringify(hist.slice(0, 5)));
            });
        }

        function loadHistory() {
            const hist = JSON.parse(localStorage.getItem('battle_history')) || [];
            const container = document.getElementById('historyList');
            if (hist.length > 0) {
                container.innerHTML = hist.map(h => `
                    <div class="history-item">
                        <span>vs ${h.opp}</span>
                        <span style="color:${h.result === 'WIN' ? '#4caf50' : '#f44336'}">${h.result}</span>
                        <span style="opacity:0.6">${h.date}</span>
                    </div>
                `).join('');
            }
        }

        function shareResult() {
            const text = `Battle Wage မှာ ကျွန်တော် ${profile.name} က နိုင်သွားပြီ! 🏆\nBattle ID: ${myId} နဲ့ ကျွန်တော့်ကို လာစိန်ခေါ်လိုက်ပါ။`;
            if (navigator.share) {
                navigator.share({ title: 'Battle Result', text: text, url: window.location.href });
            } else {
                alert("Result copied to clipboard!");
                navigator.clipboard.writeText(text);
            }
        }

        function copyMyId() {
            navigator.clipboard.writeText(myId);
            alert("ID copied!");
        }

        function goBack() { window.history.back(); }
        window.onload = loadHistory;
    </script>
</body>
</html>
