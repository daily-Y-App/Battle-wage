<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wage Battle PvP - Zapya Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #f1f5f9; }
        .battle-card { background: linear-gradient(160deg, #1e293b 0%, #0f172a 100%); position: relative; overflow: hidden; }
        .zapya-pulse { animation: zapya 2s infinite; }
        @keyframes zapya { 0% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.5); opacity: 0; } 100% { transform: scale(1); opacity: 0; } }
        .history-item { transition: all 0.2s; }
        .history-item:active { transform: scale(0.98); }
    </style>
</head>
<body class="pb-24">

    <div class="bg-white p-4 shadow-sm flex items-center justify-between sticky top-0 z-50">
        <button onclick="window.history.back()" class="w-10 h-10 flex items-center justify-center rounded-full active:bg-gray-100"><i class="fas fa-chevron-left text-gray-600"></i></button>
        <h1 class="text-lg font-extrabold text-slate-800 tracking-tight">WAGE BATTLE ⚔️</h1>
        <button onclick="showLogs()" class="w-10 h-10 flex items-center justify-center rounded-full active:bg-gray-100 text-blue-500"><i class="fas fa-history"></i></button>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-6">

        <div id="view-connect" class="space-y-6">
            <div class="bg-white rounded-[2.5rem] p-8 shadow-xl text-center border border-white">
                <div class="relative flex justify-center mb-8">
                    <div class="absolute w-32 h-32 bg-blue-500/20 rounded-full zapya-pulse"></div>
                    <div id="my-qr" class="relative z-10 p-3 bg-white rounded-3xl shadow-lg border border-gray-100"></div>
                </div>
                
                <h2 id="display-name" class="text-xl font-bold text-slate-800 mb-1">---</h2>
                <p class="text-xs font-bold text-blue-500 bg-blue-50 py-1 px-3 rounded-full inline-block mb-6 uppercase tracking-widest" id="display-code">---</p>

                <div class="grid grid-cols-1 gap-3">
                    <button onclick="startScanning()" class="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-3 active:scale-95 transition-all">
                        <i class="fas fa-camera"></i> Scan QR to Connect
                    </button>
                </div>
            </div>
            <div id="qr-reader" class="hidden rounded-3xl overflow-hidden shadow-2xl border-4 border-white"></div>
        </div>

        <div id="view-arena" class="hidden space-y-4">
            <div class="battle-card rounded-[2.5rem] p-8 shadow-2xl text-white">
                <div class="flex justify-between items-center mb-10">
                    <div class="text-center w-5/12">
                        <div class="w-20 h-20 bg-white/10 rounded-3xl mx-auto mb-3 flex items-center justify-center text-4xl border border-white/20 shadow-inner">👷</div>
                        <p class="text-[10px] font-black opacity-50 uppercase tracking-widest mb-1">You</p>
                        <p id="p1-bal" class="text-2xl font-black italic">0฿</p>
                    </div>
                    <div class="text-2xl font-black italic text-rose-500 drop-shadow-lg">VS</div>
                    <div class="text-center w-5/12">
                        <div class="w-20 h-20 bg-white/10 rounded-3xl mx-auto mb-3 flex items-center justify-center text-4xl border border-white/20 shadow-inner">👤</div>
                        <p id="p2-name" class="text-[10px] font-black opacity-50 uppercase tracking-widest mb-1">Friend</p>
                        <p id="p2-bal" class="text-2xl font-black italic">0฿</p>
                    </div>
                </div>

                <div class="h-4 bg-white/5 rounded-full flex overflow-hidden p-0.5 border border-white/10">
                    <div id="p1-bar" class="bg-blue-500 rounded-full transition-all duration-1000 shadow-[0_0_15px_rgba(59,130,246,0.5)]"></div>
                    <div id="p2-bar" class="bg-rose-500 rounded-full transition-all duration-1000 shadow-[0_0_15px_rgba(244,63,94,0.5)]"></div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="updateData()" class="bg-white py-4 rounded-2xl font-bold text-slate-700 shadow-sm active:bg-gray-50 flex items-center justify-center gap-2 border border-gray-100">
                    <i class="fas fa-sync-alt text-blue-500"></i> Refresh
                </button>
                <button onclick="endBattle('quit')" class="bg-rose-50 text-rose-600 py-4 rounded-2xl font-bold active:bg-rose-100 flex items-center justify-center gap-2 border border-rose-100">
                    <i class="fas fa-sign-out-alt"></i> End Battle
                </button>
            </div>
        </div>

        <div id="view-logs" class="hidden space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-slate-800">Battle History</h3>
                <button onclick="clearLogs()" class="text-xs text-rose-500 font-bold">Clear All</button>
            </div>
            <div id="logs-list" class="space-y-3">
                </div>
            <button onclick="refreshUI()" class="w-full py-3 text-slate-500 text-sm font-bold">Back to Arena</button>
        </div>
    </div>

    <script>
        // Data Sync from index.html
        let records = JSON.parse(localStorage.getItem('f_recs')) || [];
        let profile = JSON.parse(localStorage.getItem('f_prof')) || { name: 'User', code: 'EMP001' };
        let battleLogs = JSON.parse(localStorage.getItem('f_battle_logs')) || [];
        let currentOpponent = localStorage.getItem('f_current_opponent') || null;
        let scanner = null;

        window.onload = () => {
            document.getElementById('display-name').innerText = profile.name;
            document.getElementById('display-code').innerText = "MY CODE: " + profile.code;
            new QRCode(document.getElementById("my-qr"), { text: profile.code, width: 128, height: 128 });
            refreshUI();
        };

        function refreshUI() {
            const views = ['view-connect', 'view-arena', 'view-logs'];
            views.forEach(v => document.getElementById(v).classList.add('hidden'));

            if(currentOpponent) {
                document.getElementById('view-arena').classList.remove('hidden');
                calculateBattle();
            } else {
                document.getElementById('view-connect').classList.remove('hidden');
            }
        }

        function startScanning() {
            const reader = document.getElementById('qr-reader');
            reader.classList.remove('hidden');
            scanner = new Html5QrcodeScanner("qr-reader", { fps: 10, qrbox: 250 });
            scanner.render((code) => {
                scanner.clear();
                reader.classList.add('hidden');
                currentOpponent = code;
                localStorage.setItem('f_current_opponent', code);
                addLog(`Connected with ${code}`, 'start');
                refreshUI();
            });
        }

        function calculateBattle() {
            // Net Balance calculation: Income - Expense
            const myInc = records.filter(r => r.type === 'income').reduce((a, b) => a + b.amt, 0);
            const myExp = records.filter(r => r.type === 'expense').reduce((a, b) => a + b.amt, 0);
            const myBal = myInc - myExp;

            // Opponent Logic (Simulated for Demo)
            const oppBal = myBal * 0.9; 

            document.getElementById('p2-name').innerText = currentOpponent;
            document.getElementById('p1-bal').innerText = Math.round(myBal).toLocaleString() + "฿";
            document.getElementById('p2-bal').innerText = Math.round(oppBal).toLocaleString() + "฿";

            const total = Math.abs(myBal) + Math.abs(oppBal);
            const p1Width = (myBal / (total || 1)) * 100;
            document.getElementById('p1-bar').style.width = p1Width + "%";
            document.getElementById('p2-bar').style.width = (100 - p1Width) + "%";
        }

        function endBattle(reason) {
            if(!confirm("ပြိုင်ပွဲကို အဆုံးသတ်မှာ သေချာပါသလား?")) return;
            
            const myInc = records.filter(r => r.type === 'income').reduce((a, b) => a + b.amt, 0);
            const myExp = records.filter(r => r.type === 'expense').reduce((a, b) => a + b.amt, 0);
            const status = (myInc - myExp) > 0 ? 'WON 🏆' : 'LOST 🚩';

            addLog(`${status} against ${currentOpponent} (${reason})`, 'end');
            currentOpponent = null;
            localStorage.removeItem('f_current_opponent');
            refreshUI();
        }

        function addLog(msg, type) {
            const time = new Date().toLocaleString();
            battleLogs.unshift({ msg, time, type });
            localStorage.setItem('f_battle_logs', JSON.stringify(battleLogs));
        }

        function showLogs() {
            document.getElementById('view-arena').classList.add('hidden');
            document.getElementById('view-connect').classList.add('hidden');
            document.getElementById('view-logs').classList.remove('hidden');
            
            const list = document.getElementById('logs-list');
            list.innerHTML = battleLogs.map(log => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 ${log.type === 'start' ? 'border-blue-500' : 'border-rose-500'} history-item">
                    <p class="text-sm font-bold text-slate-700">${log.msg}</p>
                    <p class="text-[10px] text-slate-400 mt-1">${log.time}</p>
                </div>
            `).join('');
        }

        function clearLogs() {
            if(confirm("မှတ်တမ်းအားလုံးကို ဖျက်မှာလား?")) {
                battleLogs = [];
                localStorage.setItem('f_battle_logs', JSON.stringify(battleLogs));
                showLogs();
            }
        }

        function updateData() {
            location.reload(); // Refresh to get latest records from localStorage
        }
    </script>
</body>
</html>
